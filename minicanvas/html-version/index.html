  // browser this page runs on answers.
  function placeCaretAt(element, screen) {
    const selection = window.getSelection();
    let range = null;
    if (document.caretRangeFromPoint) {
      range = document.caretRangeFromPoint(screen.x, screen.y);
    } else if (document.caretPositionFromPoint) {
      const spot = document.caretPositionFromPoint(screen.x, screen.y);
      if (spot) {
        range = document.createRange();
        range.setStart(spot.offsetNode, spot.offset);
      }
    }
    if (!range || !element.contains(range.startContainer)) return selectAll(element);
    range.collapse(true);
    selection.removeAllRanges();
    selection.addRange(range);
  }

  // A new text item grows out from the point you clicked rather than away from it.
  function recentreText() {
    if (!textOrigin || !editing) return;
    const box = core.types.text.box(editing);
    editing.x = core.round(textOrigin.x - box.w / 2);
    editing.y = core.round(textOrigin.y - box.h / 2);
  }

  function isSecondTap(item, screenPoint) {
    const now = Date.now();
    const near = lastTap && lastTap.item === item && now - lastTap.at < 400
      && Math.hypot(lastTap.x - screenPoint.x, lastTap.y - screenPoint.y) < 6;
    lastTap = { item: item, at: now, x: screenPoint.x, y: screenPoint.y };
    return near;
  }

  // The select tool offers each press to whoever wants it before selecting. A
  // second click on a text item opens it instead of picking it up again.
  core.on('claim', (item, at) => {
    if (item.type !== 'text' || core.tool !== 'select') return false;
    if (!isSecondTap(item, at.screenPoint)) return false;
    startEditing(item);
    return true;
  });

  // While the editor is open the element owns the pointer, so a press inside it is
  // the browser's business: caret placement, double click to take a word, drag to
  // pull a run out. All of it is native, and none of it is written here.
  core.on('pointerdown', (event, at) => {
    if (!editing || core.spaceHeld || core.tool === 'pan') return false;
    const element = elementOf(editing);
    if (!element || !element.contains(event.target)) return false;
    return true;   // hands off: the press already reached the text
  }, 10);

  core.on('pointerdown', () => { commitText(); return false; }, 20);

  core.on('pointerdown', (event, at) => {
    if (core.tool !== 'text') return false;
    core.remember();
    const item = core.applyPen({ type: 'text', color: core.strokeColor, size: TEXT_SIZE,
                                 x: core.round(at.world.x), y: core.round(at.world.y), text: '' });
    core.scene.items.push(item);
    textOrigin = { x: at.world.x, y: at.world.y };   // it grows out from here, not below it
    core.requestRedraw();
    editing = item;
    // Taking the default away is what lets the focus stick: the browser moves
    // focus itself as part of handling a press, and would take it straight back
    // off an element focused during one. It has to happen now rather than next
    // frame, because the first keystroke can arrive before the next frame does —
    // which cost the first letter of every new text item until it did.
    event.preventDefault();
    const element = elementOf(item);
    if (element) makeEditable(element);
    // Hand back the select tool right away. Typing keeps working, because the
    // keyboard belongs to the caret while one is live, and the next click can go
    // straight to another item instead of needing Escape first.
    core.setTool('select', true);
    return true;
  }, 90);

  core.on('toolleave', (name, keepTyping) => { if (!keepTyping) commitText(); return false; });
  core.on('load', () => { editing = null; textOrigin = null; return false; });
  core.on('historystep', () => { editing = null; textOrigin = null; return false; });
  core.on('beforeexport', () => { commitText(); return false; });

  // Every key while the editor is open belongs to the text, and the element is
  // already receiving them. Escape is the way out; everything else is the browser's,
  // and the item is re-read after each one so the scene keeps up with the typing.
  core.on('typing', (event) => {
    if (!editing) return false;
    if (event.key === 'Escape') {
      commitText();
      event.preventDefault();
      return true;
    }
    // Selecting, copying, cutting and pasting are the browser's while a caret is
    // live. Anything else held down — undo above all — is not about the text, and
    // has to reach the plugin that owns it.
    const held = event.ctrlKey || event.metaKey;
    if (held && 'acvx'.indexOf((event.key || '').toLowerCase()) < 0) return false;
    // Claimed either way: without this an arrow key would nudge the selection and
    // a letter would switch tools, both while somebody is typing.
    // Read back after the keystroke has landed in the element, not before.
    requestAnimationFrame(() => { readBack(); core.requestRedraw(); });
    return true;
  });

  // The clipboard plugin asks before reaching for the scene, so copy and paste work
  // on the run of text when there is one. Both are the browser's by then: the
  // element is focused and its own default handling is the right one.
  // Copy: claimed, but with nothing in the payload, which is the clipboard
  // plugin's signal to stand back and let the element's own copy happen.
  core.on('copytext', () => !!editing);

  // Paste: claimed, so the scene does not get a new text item, and inserted here
  // as plain text so a paste from a web page arrives as words rather than markup.
  core.on('pastetext', (payload) => {
    if (!editing) return false;
    if (payload.text) document.execCommand('insertText', false, payload.text);
    requestAnimationFrame(() => { readBack(); core.requestRedraw(); });
    return true;
  });
});

/* tool: image — putting a picture into the scene.
   Needs: core, item-image. */
createMiniCanvas.plugin('tool-image', ['item-image'], function (core) {
  core.api.addImage = (src, world, maxSize) => {
    const image = new Image();
    image.onload = () => {
      const fit = Math.min(1, (maxSize || 600) / Math.max(image.width, image.height));
      const w = image.width * fit;
      const h = image.height * fit;
      const at = world || core.viewCenter();
      core.remember();
      core.imageCache.set(src, image);
      const item = {
        type: 'image',
        x: core.round(at.x - w / 2), y: core.round(at.y - h / 2),
        w: core.round(w), h: core.round(h),
        src: src
      };
      core.scene.items.push(item);
      if (core.selectItem) { core.setTool('select'); core.selectItem(item); }
      core.requestRedraw();
    };
    image.src = src;
  };
});


/* select — the selection itself: clicking, box-selecting, dragging, deleting, and
   the frame drawn around it. Everything that acts on a selection depends on this.
   Needs: core. */
createMiniCanvas.plugin('select', [], function (core) {
  const selection = core.selection = new Set();
  let marquee = null;            // world-space box while box-selecting
  // What the marquee is currently over. Drawn as selected while the drag is live,
  // but kept out of the selection until the button comes up: a box being dragged
  // is a question, and answering it early means every plugin listening for a
  // selection change hears one on every frame of the drag.
  let marqueePreview = [];
  let isDragging = false;
  let dragRemembered = false;
  let announcedSelection = '';
  let hovered = null;          // what the cursor is over, drawn without handles

  core.toolKeys.v = 'select';

  // Groups replace this. On its own, an item is the only thing it brings along.
  core.membersOf = (item) => [item];

  core.selectItem = (item, additive) => {
    const members = core.membersOf(item);
    if (!additive) {
      if (selection.has(item)) return;
      selection.clear();
      for (const member of members) selection.add(member);
      return;
    }
    const drop = selection.has(item);
    for (const member of members) {
      if (drop) selection.delete(member); else selection.add(member);
    }
  };

  // Alignment moves things a unit at a time. Without groups every item is its own
  // unit, which is exactly the plain behaviour.
  core.selectionUnits = () => {
    const units = new Map();
    for (const item of selection) {
      const key = core.groupKey ? core.groupKey(item) : item;
      if (!units.has(key)) units.set(key, []);
      units.get(key).push(item);
    }
    return [...units.values()];
  };

  const padded = core.padded = (box, pad) =>
    ({ x: box.x - pad, y: box.y - pad, w: box.w + pad * 2, h: box.h + pad * 2 });

  // The frame drawn around a set of items, and the space its handles live in. One
  // rotated item gets a frame that turns with it; anything else gets an upright
  // box around the lot, since several angles have no single frame to share.
  // `box` is what you see: the outside edge of the ink, with no padding at all.
  // `content` is where the coordinates are, and is what a resize anchors to, so the
  // two stay separate even though the frame is drawn on the first.
  const frameOf = core.frameOf = (items) => {
    const list = [...items];
    if (!list.length) return null;
    const only = list.length === 1 ? list[0] : null;
    if (only && only.angle) {
      const local = core.itemBox(only);
      if (local) return {
        box: padded(local, core.inkPad(only)), content: local, angle: only.angle,
        center: { x: local.x + local.w / 2, y: local.y + local.h / 2 }
      };
    }
    const content = core.boundsOf(list);
    if (!content) return null;
    return {
      box: core.visualBounds(list) || content, content: content, angle: 0,
      center: { x: content.x + content.w / 2, y: content.y + content.h / 2 }
    };
  };

  core.selectionFrame = () => frameOf(selection);

  // A world point in the frame's own upright space. Everything about handles is
  // decided there, so a turned frame needs no special cases downstream.
  core.toFrame = (world, frame) => {
    if (!frame.angle) return world;
    const spun = core.spin(world.x, world.y, frame.center, -core.radiansOf(frame.angle));
    return { x: spun[0], y: spun[1] };
  };

  function moveSelection(dx, dy) {
    for (const item of selection) core.transformItem(item, (x, y) => [x + dx, y + dy]);
    core.requestRedraw();
  }

  const itemUnder = (world) =>
    core.scene.items[core.itemIndexAt(world, core.GRAB_SLOP / core.scene.view.scale)];

  // Handles answer for what is already selected and nothing else. Something not in
  // the selection under the pointer is asking to be picked up, and picking it up
  // beats resizing whatever a frame edge happens to run past.
  core.handlesAnswer = (world) => {
    const item = itemUnder(world);
    return !item || selection.has(item);
  };

  // The body of a selected item, which is a move even where the item itself has
  // nothing to hit: an unfilled shape answers only to its outline, and inside it
  // there is nothing else to mean.
  const insideSelected = (world) => {
    for (const item of selection) {
      const box = core.itemBox(item);
      if (!box) continue;                  // a stroke is a line, with no body to grab
      const pad = core.inkPad(item);
      const local = item.angle
        ? core.toFrame(world, { angle: item.angle,
                                center: { x: box.x + box.w / 2, y: box.y + box.h / 2 } })
        : world;
      if (local.x >= box.x - pad && local.x <= box.x + box.w + pad
       && local.y >= box.y - pad && local.y <= box.y + box.h + pad) return true;
    }
    return false;
  };

  // Drag deltas are sub-0.1 at high zoom, so round once the drag ends, not per frame.
  core.roundSelection = () => {
    for (const item of selection) {
      core.transformItem(item, (x, y) => [core.round(x), core.round(y)]);
      if (typeof item.size === 'number') item.size = core.round(item.size);
      if (typeof item.w === 'number') { item.w = core.round(item.w); item.h = core.round(item.h); }
    }
  };

  const normalised = core.normalised = (box) => ({
    x: Math.min(box.x1, box.x2), y: Math.min(box.y1, box.y2),
    w: Math.abs(box.x2 - box.x1), h: Math.abs(box.y2 - box.y1)
  });

  // Everything the dragged rectangle touches. `box` goes to `within` too, not
  // just the point predicate: a shape with a hollow middle needs to reason about
  // where the marquee's edges are, not just which points it covers.
  function itemsWithin(marqueeBox) {
    const box = normalised(marqueeBox);
    const right = box.x + box.w, bottom = box.y + box.h;
    const inside = (x, y) => x >= box.x && x <= right && y >= box.y && y <= bottom;
    const found = new Set();
    for (const item of core.scene.items) {
      const type = core.types[item.type];
      if (type && type.within) {
        if (type.within(item, inside, box)) found.add(item);
        continue;
      }
      const itemBox = core.boundsOf([item]);
      if (itemBox && itemBox.x <= right && itemBox.x + itemBox.w >= box.x
                  && itemBox.y <= bottom && itemBox.y + itemBox.h >= box.y) found.add(item);
    }
    // Touching one of a group's members brings the whole group, so the preview
    // promises exactly what letting go will take.
    for (const item of [...found]) for (const member of core.membersOf(item)) found.add(member);
    return [...found];
  }

  const selectWithin = (marqueeBox) => {
    for (const item of itemsWithin(marqueeBox)) selection.add(item);
  };

  const deleteSelection = core.deleteSelection = () => {
    if (!selection.size) return;
    core.remember();
    core.scene.items = core.scene.items.filter((item) => !selection.has(item));
    selection.clear();
    core.requestRedraw();
  };

  core.on('hover', (event, at) => {
    const over = (at && core.tool === 'select')
      ? core.scene.items[core.itemIndexAt(at.world, core.GRAB_SLOP / core.scene.view.scale)]
      : undefined;
    // Something already selected shows its own frame, so hovering it adds nothing.
    const next = (over && !selection.has(over)) ? over : null;
    if (next === hovered) return false;
    hovered = next;
    core.requestRedraw();
    return false;
  });

  core.on('pointerdown', (event, at) => {
    if (core.tool !== 'select') return false;
    if (event.button !== 0 || event.ctrlKey || event.metaKey) return false;
    hovered = null;   // the click resolves it one way or the other
    // Resize and rotate get first refusal, but only over their own selection.
    if (core.handlesAnswer(at.world) && core.fire('handledown', event, at)) return true;

    const item = itemUnder(at.world) || null;
    if (item) {
      if (core.fire('claim', item, at)) return true;       // text opens for editing instead
      core.selectItem(item, event.shiftKey);
      if (selection.has(item) && core.fire('dragstart', event, at)) {
        dragRemembered = true;   // something replaced the drag, and recorded its own step
        isDragging = true;
      } else {
        dragRemembered = false;
        isDragging = selection.has(item);
      }
    } else if (!event.shiftKey && insideSelected(at.world)) {
      dragRemembered = false;
      isDragging = true;
    } else {
      if (!event.shiftKey) selection.clear();
      marquee = { x1: at.world.x, y1: at.world.y, x2: at.world.x, y2: at.world.y };
      marqueePreview = [];
    }
    core.requestRedraw();
    return true;
  }, 50);

  core.on('pointermove', (event, at) => {
    if (isDragging) {
      if (!dragRemembered) { core.remember(); dragRemembered = true; }
      moveSelection(at.world.x - at.from.x, at.world.y - at.from.y);
      return true;
    }
    if (marquee) {
      marquee.x2 = at.world.x;
      marquee.y2 = at.world.y;
      // Recomputed against the whole scene each frame rather than accumulated, so
      // dragging back over something takes it out again the same way it went in.
      marqueePreview = itemsWithin(marquee).filter((item) => !selection.has(item));
      core.requestRedraw();
      return true;
    }
    return false;
  }, 50);

  core.on('pointerup', () => {
    if (isDragging) { core.roundSelection(); isDragging = false; }
    if (marquee) {
      // A click leaves a zero-size marquee behind. Without this it would box-select
      // anything whose bounding box happens to contain that one point.
      const box = normalised(marquee);
      const minimum = 2 / core.scene.view.scale;
      if (box.w > minimum || box.h > minimum) selectWithin(marquee);
      marquee = null;
      marqueePreview = [];
    }
    return false;
  });

  core.on('toolleave', () => {
    selection.clear(); marquee = null; marqueePreview = []; hovered = null; return false;
  });
  core.on('load', () => { selection.clear(); marqueePreview = []; hovered = null; return false; });
  // The items that come back are freshly parsed objects, not the ones selected.
  core.on('historystep', () => {
    selection.clear(); marqueePreview = []; hovered = null; return false;
  });

  const NUDGES = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };

  core.on('keydown', (event) => {
    if (!selection.size) return false;
    if (core.fire('selectionkey', event)) return true;
    const nudge = NUDGES[event.key];
    if (nudge) {
      const step = event.shiftKey ? 10 : 1;
      if (!event.repeat) core.remember();   // one undo entry per held key, not per repeat
      moveSelection(nudge[0] * step, nudge[1] * step);
      event.preventDefault();
      return true;
    }
    if (event.key === 'Delete' || event.key === 'Backspace') {
      deleteSelection();
      event.preventDefault();
      return true;
    }
    return false;
  });

  // The overlay is elements, not paint, so the pieces are pooled rather than
  // redrawn: a frame that was there last frame is still there, moved. Handing out
  // a node per shape per frame and letting the browser reconcile the difference is
  // the whole rendering strategy in miniature.
  const pool = [];
  let taken = 0;
  function piece(className) {
    let node = pool[taken];
    if (!node) {
      node = document.createElement('div');
      pool[taken] = node;
      core.overlay.appendChild(node);
    }
    taken++;
    node.className = className;
    // A node keeps nothing from the piece it was last frame: the frame writes
    // its size and rotation inline, and a handle's stylesheet leaves those
    // alone, so a stale one would turn a nine-pixel handle into a leftover box.
    // Clearing here also lifts the display:none of a node that sat out a frame.
    node.style.cssText = '';
    return node;
  }

  // A world box, placed in the overlay's screen space and turned about its own
  // centre. Laying it out upright and rotating the element afterwards is the same
  // trick the canvas build played with the context, and it means handles inside a
  // frame need no per-corner trigonometry either.
  function placeFrame(node, frame) {
    const scale = core.scene.view.scale;
    const at = core.toScreen({ x: frame.box.x, y: frame.box.y });
    node.style.left = at.x + 'px';
    node.style.top = at.y + 'px';
    node.style.width = (frame.box.w * scale) + 'px';
    node.style.height = (frame.box.h * scale) + 'px';
    node.style.transform = frame.angle ? 'rotate(' + frame.angle + 'deg)' : '';
    return node;
  }

  core.on('overlay', () => {
    taken = 0;
    if (selection.size || marquee || hovered) {
      // What the cursor is over gets the outline and nothing else: handles would
      // invite a drag that hovering has not earned. It is the same frame the click
      // would land in, turned item and all, so the box always promises what the
      // press will actually take.
      if (hovered) {
        const frame = core.frameOf(core.membersOf(hovered));
        if (frame) placeFrame(piece('mc-frame mc-hovered'), frame);
      }

      // A solid grey box, filled: it is a region being swept rather than a thing
      // that has been chosen, so it stays out of the selection's colour entirely
      // and lets the blue outlines inside it do the talking.
      if (marquee) {
        placeFrame(piece('mc-marquee'), { box: normalised(marquee), angle: 0 });
        // What letting go would take, outlined exactly as a settled selection is.
        // Handles are left off: they belong to a selection you can already act on,
        // and this one does not exist yet.
        for (const item of marqueePreview) {
          const own = core.frameOf([item]);
          if (own) placeFrame(piece('mc-frame'), own);
        }
      }

      // Several loose items each get their own outline. A group gets one, because
      // a group is one thing until you take it apart.
      if (selection.size > 1 && !(core.selectionIsOneGroup && core.selectionIsOneGroup())) {
        for (const item of selection) {
          const own = core.frameOf([item]);
          if (own) placeFrame(piece('mc-frame'), own);
        }
      }

      const frame = core.selectionFrame();
      if (frame) {
        placeFrame(piece('mc-frame'), frame);
        core.fire('handles', frame, piece);
      }
    }
    for (let i = taken; i < pool.length; i++) pool[i].style.display = 'none';
    return false;
  });

  // Every path that changes the selection ends in a redraw, so one check here
  // covers all of them without instrumenting each.
  //
  // The signature is built from which items are selected, not how many. Counting
  // alone misses swapping one item for another: a listener that cares what kind of
  // thing is picked would never hear about it.
  let nextMark = 1;
  const marks = new WeakMap();
  const markOf = (item) => {
    let mark = marks.get(item);
    if (!mark) { mark = nextMark++; marks.set(item, mark); }
    return mark;
  };

  core.on('afterdraw', () => {
    const units = core.selectionUnits().length;
    // Units, not items, for the count: alignment needs two things to line up, and
    // a group counts as one thing.
    const shape = units + ':' + [...selection].map(markOf).sort((a, b) => a - b).join(',');
    if (shape === announcedSelection) return false;
    announcedSelection = shape;
    core.emit('selectionchange', { items: selection.size, units: units });
    return false;
  });

  Object.assign(core.api, {
    selection: () => [...selection],
    selectAll: () => {
      selection.clear();
      core.scene.items.forEach((item) => selection.add(item));
      core.requestRedraw();
    },
    deleteSelection: deleteSelection
  });
});


/* transform — the handles on a selection: four corners to resize, four edges to
   stretch one axis, one stalk to rotate. All of them work in the frame's own
   space, so a turned selection scales and stretches along the axes you see.
   Needs: core, select. */
createMiniCanvas.plugin('transform', ['select'], function (core) {
  const ROTATE_REACH = 22;   // screen pixels above the box for the spin handle
  let resize = null;
  let rotation = null;
  let dragRemembered = false;

  // Each corner drags against the opposite one, which must stay exactly put. The
  // handles sit on the padded box you can see, but they anchor to the real content
  // corner: anchoring to the padded corner would drift everything by the padding.
  // `push` is the way the corner faces, which is all the cursor needs to know.
  function handleCorners(box, anchorBox) {
    const source = anchorBox || box;
    const right = box.x + box.w, bottom = box.y + box.h;
    const holdRight = source.x + source.w, holdBottom = source.y + source.h;
    return [
      { x: box.x, y: box.y,   push: { x: -1, y: -1 }, anchor: { x: holdRight, y: holdBottom } },
      { x: right, y: box.y,   push: { x: 1,  y: -1 }, anchor: { x: source.x,  y: holdBottom } },
      { x: box.x, y: bottom,  push: { x: -1, y: 1 },  anchor: { x: holdRight, y: source.y } },
      { x: right, y: bottom,  push: { x: 1,  y: 1 },  anchor: { x: source.x,  y: source.y } }
    ];
  }

  // How far inside the frame an edge still answers, in screen pixels. Small on
  // purpose: an edge is grabbed by aiming at the line or just outside it, and the
  // room inside belongs to what the frame is drawn around. A band reaching inwards
  // as far as it reaches out means a press near the top of a shape resizes it when
  // it plainly meant to pick it up.
  const EDGE_INSIDE = 3;

  // The edges, each dragging against the opposite one and leaving the other axis
  // alone. An edge is grabbed anywhere along its length and draws nothing of its
  // own: the frame is already a line in exactly the right place, and four more
  // squares on it would crowd a small selection out of existence.
  //
  // Only the anchor's coordinate on the dragged axis is doing any work. The other
  // one is a real content edge all the same, so `side` reads it the same way it
  // reads a corner's.
  function handleEdges(box, anchorBox) {
    const source = anchorBox || box;
    const right = box.x + box.w, bottom = box.y + box.h;
    const holdRight = source.x + source.w, holdBottom = source.y + source.h;
    return [
      { axis: 'x', at: box.x, from: box.y, to: bottom, push: { x: -1, y: 0 },
        anchor: { x: holdRight, y: source.y } },
      { axis: 'x', at: right, from: box.y, to: bottom, push: { x: 1, y: 0 },
        anchor: { x: source.x, y: source.y } },
      { axis: 'y', at: box.y, from: box.x, to: right, push: { x: 0, y: -1 },
        anchor: { x: source.x, y: holdBottom } },
      { axis: 'y', at: bottom, from: box.x, to: right, push: { x: 0, y: 1 },
        anchor: { x: source.x, y: source.y } }
    ];
  }

  // What a press would take hold of, in the frame's own space, or null for the
  // plain canvas. One answer serves both the press and the cursor drawn while
  // hovering, so the two can never promise different things.
  function handleAt(local, frame) {
    const reach = core.HANDLE_SIZE / core.scene.view.scale;
    const inward = EDGE_INSIDE / core.scene.view.scale;
    const corner = handleCorners(frame.box, frame.content).find(
      (point) => Math.abs(point.x - local.x) < reach && Math.abs(point.y - local.y) < reach);
    if (corner) return corner;
    // Corners answer first, so the ends of an edge belong to the corner sitting
    // there and the edge speaks only for the length between them.
    //
    // An edge reaches outwards, and barely inwards at all. `push` is the way out
    // of the frame on that axis, so the sign of the offset says which side of the
    // line the pointer is on: outside is a resize, inside is the thing itself, to
    // be picked up or moved.
    return handleEdges(frame.box, frame.content).find((edge) => {
      const across = edge.axis === 'x' ? local.x : local.y;
      const along = edge.axis === 'x' ? local.y : local.x;
      const out = (across - edge.at) * (edge.axis === 'x' ? edge.push.x : edge.push.y);
      return out < reach && out > -inward
          && along > edge.from - reach && along < edge.to + reach;
    }) || null;
  }

  // Eight cursors around the compass, one per 45°, so a turned frame is grabbed
  // with the arrow pointing the way the edge will actually go. Only four names
  // exist, since each one covers a direction and its opposite.
  const RESIZE_CURSORS = ['ew-resize', 'nwse-resize', 'ns-resize', 'nesw-resize'];
  function resizeCursor(handle, angle) {
    const facing = Math.atan2(handle.push.y, handle.push.x) + core.radiansOf(angle || 0);
    const sector = Math.round(facing / (Math.PI / 4));
    return RESIZE_CURSORS[((sector % 4) + 4) % 4];
  }

  const rotationHandle = (box) =>
    ({ x: box.x + box.w / 2, y: box.y - ROTATE_REACH / core.scene.view.scale });

  // While a group or mixed selection turns, frameOf would re-fit an upright box every
  // frame and the outline would breathe instead of spin. One boxed item already gets
  // a turning frame from its own angle; everything else keeps the bounds from the
  // press and applies the drag's degrees until the pointer comes up.
  const baseSelectionFrame = core.selectionFrame;
  core.selectionFrame = () => {
    if (rotation && rotation.frame && !rotation.frame.angle) {
      const lone = rotation.items.length === 1 && core.itemBox(rotation.items[0].item);
      if (!lone) {
        return {
          box: rotation.frame.box, content: rotation.frame.content,
          angle: rotation.degrees || 0, center: rotation.center
        };
      }
    }
    return baseSelectionFrame();
  };

  // A handle under the pointer wins over whatever shape is stacked beneath it. The
  // select plugin's default only lets handles answer when nothing else is there.
  const baseHandlesAnswer = core.handlesAnswer;
  core.handlesAnswer = (world) => {
    const frame = core.selectionFrame();
    if (frame) {
      const local = core.toFrame(world, frame);
      const reach = core.HANDLE_SIZE / core.scene.view.scale;
      const near = (point) => Math.abs(point.x - local.x) < reach && Math.abs(point.y - local.y) < reach;
      if (near(rotationHandle(frame.box)) || handleAt(local, frame)) return true;
    }
    return baseHandlesAnswer(world);
  };

  // Object.assign alone cannot remove a field the snapshot never had, so a drag
  // that adds one (an angle, say) would accumulate it frame after frame.
  function restoreOriginal(entry) {
    const original = JSON.parse(entry.original);
    for (const key of Object.keys(entry.item)) if (!(key in original)) delete entry.item[key];
    Object.assign(entry.item, original);
  }

  const snapshot = () => [...core.selection].map((item) => ({ item: item, original: JSON.stringify(item) }));

  function startResize(handle, world, frame) {
    resize = {
      anchor: handle.anchor,          // in the frame's own space, on the content corner
      axis: handle.axis || null,      // an edge stretches this one; a corner both
      // Measured from where the pointer actually went down, so the scale starts at
      // exactly 1 and nothing jumps on the first frame.
      from: core.toFrame(world, frame),
      angle: frame.angle,
      center: { x: frame.center.x, y: frame.center.y },
      // Which edges the anchor sits on, so the drag can put them back afterwards.
      side: {
        x: handle.anchor.x > frame.content.x + frame.content.w / 2 ? 1 : 0,
        y: handle.anchor.y > frame.content.y + frame.content.h / 2 ? 1 : 0
      },
      // Where the anchor is on screen at the moment of the press. A turned item
      // spins about its own centre, and scaling moves that centre, so holding the
      // anchor still in the item's own space is not enough to hold it still on
      // screen. This is the fixed point the whole drag is measured back to: taking
      // it from the frame before instead would re-aim at a target that has itself
      // just moved, and the item would crawl away from the pointer.
      home: core.spinPoint(handle.anchor, frame.center, frame.angle),
      // Scale the original geometry every frame instead of the last frame's, so a
      // long drag can't accumulate rounding error.
      items: snapshot()
    };
  }

  function applyResize(world, keepAspect) {
    const anchor = resize.anchor;
    const local = core.toFrame(world, resize);
    const spanX = resize.from.x - anchor.x;
    const spanY = resize.from.y - anchor.y;
    let scaleX = (spanX && resize.axis !== 'y') ? Math.max(0.02, (local.x - anchor.x) / spanX) : 1;
    let scaleY = (spanY && resize.axis !== 'x') ? Math.max(0.02, (local.y - anchor.y) / spanY) : 1;
    // Shift holds the ratio on a corner. An edge drag is one axis by definition, so
    // there is no ratio left to hold and shift has nothing to say.
    if (keepAspect && !resize.axis) scaleX = scaleY = Math.max(scaleX, scaleY);

    const list = resize.items.map((entry) => entry.item);
    for (const entry of resize.items) {
      restoreOriginal(entry);
      const item = entry.item;
      core.transformItem(item, (x, y) => [
        anchor.x + (x - anchor.x) * scaleX,
        anchor.y + (y - anchor.y) * scaleY
      ]);
      const type = core.types[item.type];
      // A stroke's `width` is deliberately left alone. Line weight belongs to the
      // pen that drew it, not to the geometry, so scaling never re-weights ink.
      if (type && type.scale) type.scale(item, scaleX, scaleY);
    }

    // Text has no stored width: it is however wide the glyphs come out, which does
    // not scale in step with its position. So rather than trust the arithmetic,
    // measure the result and slide the anchored edges back where they started.
    const after = resize.angle ? core.itemBox(list[0]) : core.boundsOf(list);
    if (after) {
      const dx = anchor.x - (resize.side.x ? after.x + after.w : after.x);
      const dy = anchor.y - (resize.side.y ? after.y + after.h : after.y);
      if (dx || dy) for (const item of list) core.transformItem(item, (x, y) => [x + dx, y + dy]);
    }

    // The anchor is back where it belongs in the item's own space; this puts it
    // back where it belongs on screen, which for a turned item is not the same
    // thing. Only a lone item is ever framed at an angle, so there is only ever
    // one centre to answer for.
    if (resize.angle) {
      const now = core.spinPoint(anchor, core.itemCenter(list[0]), resize.angle);
      core.transformItem(list[0], (x, y) => [x + resize.home.x - now.x, y + resize.home.y - now.y]);
    }
    core.requestRedraw();
  }

  function startRotation(world) {
    const frame = baseSelectionFrame();
    const box = core.boundsOf(core.selection);
    const center = { x: box.x + box.w / 2, y: box.y + box.h / 2 };
    const items = [...core.selection];
    rotation = {
      center: center,
      from: Math.atan2(world.y - center.y, world.x - center.x),
      // Where the thing already points, so a snap can land on a true angle rather
      // than fifteen degrees further round from wherever it happened to be. One
      // boxed item knows its own angle; a stroke or a mixed selection does not, so
      // for those the snap is measured from where the drag started.
      base: (items.length === 1 && core.itemBox(items[0]) && items[0].angle) || 0,
      frame: frame,
      degrees: 0,
      items: snapshot()
    };
  }

  function applyRotation(world, snap) {
    const now = Math.atan2(world.y - rotation.center.y, world.x - rotation.center.x);
    let degrees = (now - rotation.from) * 180 / Math.PI;
    // Snap the angle the item ends up at, not the amount it turned by. Something
    // sitting at 7° lands on 0° or 15°, which is what straightening means.
    if (snap) degrees = Math.round((rotation.base + degrees) / 15) * 15 - rotation.base;
    rotation.degrees = degrees;
    for (const entry of rotation.items) {
      restoreOriginal(entry);
      rotateItem(entry.item, rotation.center, degrees);
    }
    core.requestRedraw();
  }

  // Strokes rotate by moving their points and need no angle field. Boxed items
  // carry `angle` and swing their position around the group centre.
  function rotateItem(item, center, degrees) {
    const radians = core.radiansOf(degrees);
    const box = core.itemBox(item);
    if (!box) {
      core.transformItem(item, (x, y) => core.spin(x, y, center, radians));
      return;
    }
    const middle = { x: box.x + box.w / 2, y: box.y + box.h / 2 };
    const moved = core.spin(middle.x, middle.y, center, radians);
    item.x += moved[0] - middle.x;
    item.y += moved[1] - middle.y;
    const turned = ((item.angle || 0) + degrees) % 360;
    item.angle = core.round(turned < 0 ? turned + 360 : turned);
    if (!item.angle) delete item.angle;   // back at zero, so leave the file clean
  }

  core.on('handledown', (event, at) => {
    const frame = core.selectionFrame();
    if (!frame) return false;
    const local = core.toFrame(at.world, frame);
    const reach = core.HANDLE_SIZE / core.scene.view.scale;
    const near = (point) => Math.abs(point.x - local.x) < reach && Math.abs(point.y - local.y) < reach;
    dragRemembered = false;
    if (near(rotationHandle(frame.box))) { startRotation(at.world); return true; }
    const handle = handleAt(local, frame);
    if (!handle) return false;
    startResize(handle, at.world, frame);
    return true;
  });

  // The only hint that an edge can be dragged at all, since edges draw nothing.
  // Hover does not fire while a button is down, so the cursor chosen on the way in
  // is the one the whole drag keeps.
  core.on('hover', (event, at) => {
    const frame = (at && core.tool === 'select' && core.handlesAnswer(at.world))
      ? core.selectionFrame() : null;
    const handle = frame && handleAt(core.toFrame(at.world, frame), frame);
    if (handle) core.host.style.cursor = resizeCursor(handle, frame.angle);
    else core.applyCursor();
    return false;
  }, 20);

  core.on('pointermove', (event, at) => {
    if (!rotation && !resize) return false;
    if (!dragRemembered) { core.remember(); dragRemembered = true; }
    if (rotation) applyRotation(at.world, event.shiftKey);   // shift snaps to 15°
    else applyResize(at.world, event.shiftKey);
    return true;
  }, 20);

  core.on('pointerup', () => {
    if (resize || rotation) core.roundSelection();
    resize = rotation = null;
    return false;
  });
  core.on('toolleave', () => { resize = rotation = null; return false; });

  // Handles are elements too, from the same pool the frame came from. They are
  // placed in the frame's own upright space and land rotated with it, which is
  // why nothing here does any trigonometry: `piece` hands out a node, the frame
  // element it sits in is already turned.
  core.on('handles', (frame, piece) => {
    const scale = core.scene.view.scale;
    const at = (point) => {
      const screen = core.toScreen(point);
      return { left: screen.x + 'px', top: screen.y + 'px' };
    };
    // The corner squares sit in screen space like the frame does, each turned
    // about the frame's centre so a tilted selection keeps square handles.
    const spin = (point) => frame.angle
      ? core.spinPoint(point, frame.center, frame.angle) : point;

    for (const corner of handleCorners(frame.box, frame.content)) {
      const node = piece('mc-handle');
      const spot = at(spin(corner));
      node.style.left = spot.left;
      node.style.top = spot.top;
      node.style.transform = '';
    }
    const spinner = rotationHandle(frame.box);   // a stalk above the box, so it never
    const top = { x: frame.box.x + frame.box.w / 2, y: frame.box.y };   // sits on the work
    // Hung from the knob rather than standing on the box, so it can be turned
    // about its own top end: both ends move rigidly with the frame, so the line
    // between them turns by exactly the frame's own angle.
    const knobAt = at(spin(spinner));
    const stalk = piece('mc-stalk');
    stalk.style.left = knobAt.left;
    stalk.style.top = knobAt.top;
    stalk.style.height = (Math.hypot(spinner.x - top.x, spinner.y - top.y) * scale) + 'px';
    stalk.style.transform = 'rotate(' + (frame.angle || 0) + 'deg)';
    const knob = piece('mc-knob');
    knob.style.left = knobAt.left;
    knob.style.top = knobAt.top;
    return false;
  });

});


/* groups — a shared name on a set of items, so they select and move as one.
   Needs: core, select. */
createMiniCanvas.plugin('groups', ['select'], function (core) {
  // A group is a shared name on the items, nothing more: no container, no nesting,
  // no order of its own. Selecting one member selects the rest.
  core.membersOf = (item) => {
    if (!item || !item.group) return [item];
    return core.scene.items.filter((other) => other.group === item.group);
  };

  core.groupKey = (item) => item.group || item;

  core.selectionIsOneGroup = () => {
    const items = [...core.selection];
    if (!items.length || !items[0].group) return false;
    return items.every((item) => item.group === items[0].group);
  };

  function nextGroupName(taken) {
    let highest = 0;
    const consider = (name) => {
      const match = /^g(\d+)$/.exec(name || '');
      if (match) highest = Math.max(highest, Number(match[1]));
    };
    for (const item of core.scene.items) consider(item.group);
    for (const name of taken || []) consider(name);
    return 'g' + (highest + 1);
  }
  core.nextGroupName = nextGroupName;

  // One key does both, because grouping and ungrouping are the same gesture from
  // the user's side: take these things apart, or put them together.
  function toggleGroup() {
    const items = [...core.selection];
    if (!items.length) return;
    if (core.selectionIsOneGroup()) {
      core.remember();
      for (const item of items) delete item.group;   // they stay selected, now singly
    } else {
      if (items.length < 2) return;                  // a group of one is just an item
      core.remember();
      const name = nextGroupName();
      for (const item of items) item.group = name;
    }
    core.requestRedraw();
  }

  core.on('keydown', (event) => {
    if (!(event.ctrlKey || event.metaKey)) return false;
    if ((event.key || '').toLowerCase() !== 'g') return false;
    toggleGroup();
    event.preventDefault();
    return true;
  }, 20);

  core.api.toggleGroup = toggleGroup;
  // So a toolbar can show whether the button will group or ungroup.
  core.api.isGrouped = () => core.selectionIsOneGroup();
});


/* arrange — lining things up and stacking them: alt+wasd to align, alt+v and
   alt+h to centre, brackets for layer order.
   Needs: core, select. */
createMiniCanvas.plugin('arrange', ['select'], function (core) {
  // Alignment matches on the physical key first, because alt turns a letter into
  // some other glyph on most layouts: option-w is not "w" by the time the event
  // arrives. The letter and the glyph are listed too, so a browser or layout that
  // reports the key differently still lands on the same command.
  const ALIGN_KEYS = {
    KeyA: [-1, 0], a: [-1, 0], 'å': [-1, 0],
    KeyD: [1, 0],  d: [1, 0],  '∂': [1, 0],
    KeyW: [0, -1], w: [0, -1], '∑': [0, -1],
    KeyS: [0, 1],  s: [0, 1],  'ß': [0, 1]
  };
  const CENTER_KEYS = { KeyV: 'y', v: 'y', '√': 'y', KeyH: 'x', h: 'x', '˙': 'x' };
  // Shift turns [ and ] into { and } on most layouts, so accept both spellings.
  const BRACKETS = { '[': -1, '{': -1, ']': 1, '}': 1 };

  const lookup = (table, event) => table[event.code] || table[(event.key || '').toLowerCase()];

  function slideUnit(items, axis, distance) {
    if (!distance) return false;
    for (const item of items) {
      core.transformItem(item, (x, y) =>
        axis === 'x' ? [core.round(x + distance), y] : [x, core.round(y + distance)]);
    }
    return true;
  }

  // Everything lines up on whichever edge already reaches furthest that way.
  function alignSelection(direction) {
    const units = core.selectionUnits();
    if (units.length < 2) return;
    const axis = direction[0] ? 'x' : 'y';
    const toward = direction[0] || direction[1];      // -1 towards the top or left
    const edgeOf = (box) => axis === 'x'
      ? (toward < 0 ? box.x : box.x + box.w)
      : (toward < 0 ? box.y : box.y + box.h);
    const target = edgeOf(core.boundsOf(core.selection));
    core.remember();
    let moved = false;
    for (const unit of units) moved = slideUnit(unit, axis, target - edgeOf(core.boundsOf(unit))) || moved;
    if (!moved) core.forget(); else core.requestRedraw();
  }

  // Centres share an axis: 'y' puts everything on one horizontal line, 'x' stacks
  // them in one column.
  function centerSelection(axis) {
    const units = core.selectionUnits();
    if (units.length < 2) return;
    const middleOf = (box) => axis === 'x' ? box.x + box.w / 2 : box.y + box.h / 2;
    const target = middleOf(core.boundsOf(core.selection));
    core.remember();
    let moved = false;
    for (const unit of units) moved = slideUnit(unit, axis, target - middleOf(core.boundsOf(unit))) || moved;
    if (!moved) core.forget(); else core.requestRedraw();
  }

  // +1 moves the selection toward the front, -1 toward the back. By default it goes
  // all the way; oneStep moves a single layer instead.
  function reorder(direction, oneStep) {
    const selection = core.selection;
    if (!selection.size) return;
    if (!oneStep) {
      const picked = core.scene.items.filter((item) => selection.has(item));
      const rest = core.scene.items.filter((item) => !selection.has(item));
      const next = direction > 0 ? rest.concat(picked) : picked.concat(rest);
      if (next.every((item, index) => item === core.scene.items[index])) return;   // already there
      core.remember();
      core.scene.items = next;
      core.requestRedraw();
      return;
    }
    const indices = [];
    core.scene.items.forEach((item, index) => { if (selection.has(item)) indices.push(index); });
    if (direction > 0) indices.reverse();   // move the frontmost first, or they collide
    core.remember();
    let moved = false;
    for (const index of indices) {
      const target = index + direction;
      if (target < 0 || target >= core.scene.items.length) continue;
      if (selection.has(core.scene.items[target])) continue;   // already stacked against a sibling
      const swap = core.scene.items[target];
      core.scene.items[target] = core.scene.items[index];
      core.scene.items[index] = swap;
      moved = true;
    }
    if (!moved) core.forget();   // hitting the end of the stack is not an edit
    else core.requestRedraw();
  }

  core.on('selectionkey', (event) => {
    // Alt lines things up: wasd for the four edges, v and h for the two centres.
    if (event.altKey && !event.ctrlKey && !event.metaKey) {
      const toward = lookup(ALIGN_KEYS, event);
      if (toward) { alignSelection(toward); event.preventDefault(); return true; }
      const axis = lookup(CENTER_KEYS, event);
      if (axis) { centerSelection(axis); event.preventDefault(); return true; }
    }
    const layer = BRACKETS[event.key];
    if (layer) {
      reorder(layer, event.shiftKey);   // shift moves one step instead of all the way
      event.preventDefault();
      return true;
    }
    return false;
  });

  Object.assign(core.api, { align: alignSelection, center: centerSelection, reorder: reorder });
});


/* erase — remove whatever is under the cursor, and only what is visible there.
   Needs: core. */
createMiniCanvas.plugin('erase', [], function (core) {
  core.toolKeys.e = 'erase';

  // No slop: erasing removes what is painted, nothing beside it. A line's target
  // is exactly its own width, so thinning a line thins its eraser target with it.
  function eraseAt(world) {
    const index = core.itemIndexAt(world, 0);
    if (index < 0) return;
    core.remember();
    if (core.selection) core.selection.delete(core.scene.items[index]);
    core.scene.items.splice(index, 1);
    core.requestRedraw();
  }

  core.on('pointerdown', (event, at) => {
    if (core.tool !== 'erase') return false;
    eraseAt(at.world);
    return true;
  }, 40);

  core.on('pointermove', (event, at) => {
    if (core.tool !== 'erase' || !event.buttons) return false;
    eraseAt(at.world);
    return true;
  }, 40);
});


/* history — undo and redo. Nothing else knows it exists: the core's remember and
   forget do nothing until this replaces them.
   Needs: core. */
createMiniCanvas.plugin('history', [], function (core) {
  const undoStack = [];
  let redoStack = [];
  let droppedRedo = [];   // the trail the last remember() set aside

  core.record = () => {
    undoStack.push(JSON.stringify(core.scene.items));
    if (undoStack.length > 60) undoStack.shift();
    // A fresh edit ends the redo trail: you cannot redo your way into a future that
    // no longer follows from here. Held aside in case this edit turns out to be a
    // no-op, so pressing a key that changes nothing does not cost you the trail.
    droppedRedo = redoStack;
    redoStack = [];
  };

  // The edit did nothing after all, so take the step back out.
  core.forget = () => {
    undoStack.pop();
    redoStack = droppedRedo;
    droppedRedo = [];
  };

  // Undo and redo are the same move in opposite directions: hand the current scene
  // to the other stack, take the top of this one.
  function step(from, to) {
    if (!from.length) return;
    core.fire('historystep');
    to.push(JSON.stringify(core.scene.items));
    core.scene.items = JSON.parse(from.pop());
    core.requestRedraw();
  }

  const undo = () => step(undoStack, redoStack);
  const redo = () => step(redoStack, undoStack);

  core.on('load', () => {
    undoStack.length = 0;
    redoStack = [];
    droppedRedo = [];
    return false;
  });

  core.on('keydown', (event) => {
    if (!(event.ctrlKey || event.metaKey)) return false;
    if (event.code !== 'KeyZ' && (event.key || '').toLowerCase() !== 'z') return false;
    if (event.shiftKey) redo(); else undo();   // shift holds z, so match on the code too
    event.preventDefault();
    return true;
  }, 10);

  Object.assign(core.api, { undo: undo, redo: redo });
});


/* clipboard — copy, paste, and option-drag to duplicate. The copy buffer is a
   scene fragment in the same format as the file, so it travels anywhere text does.
   Needs: core, select. Better with: groups (copies get fresh names). */
createMiniCanvas.plugin('clipboard', ['select'], function (core) {
  let clipboard = '';   // fallback when the system clipboard is closed

  // Copies land at the front, keep their order among themselves, and end up
  // selected so a duplicate can be dragged straight off the original. Groups are
  // renamed, or the copy would select together with the thing it came from.
  function duplicateItems(items, dx, dy) {
    if (!items.length) return [];
    const renamed = new Map();
    const copies = items.map((item) => {
      const copy = JSON.parse(JSON.stringify(item));
      if (copy.group && core.nextGroupName) {
        if (!renamed.has(copy.group)) renamed.set(copy.group, core.nextGroupName(renamed.values()));
        copy.group = renamed.get(copy.group);
      }
      if (dx || dy) core.transformItem(copy, (x, y) => [core.round(x + dx), core.round(y + dy)]);
      return copy;
    });
    core.setTool('select');   // leaving another tool would clear the selection
    core.remember();
    core.scene.items.push(...copies);
    core.selection.clear();
    for (const copy of copies) core.selection.add(copy);
    core.requestRedraw();
    return copies;
  }

  const selected = () => core.scene.items.filter((item) => core.selection.has(item));

  function copySelection() {
    const items = selected();
    if (!items.length) return '';
    clipboard = JSON.stringify({ format: 'minicanvas/1', items: items });
    return clipboard;
  }

  function pasteText(text) {
    if (!text) return false;
    let parsed = null;
    try { parsed = JSON.parse(text); } catch (error) { parsed = null; }
    const items = parsed && Array.isArray(parsed.items) ? parsed.items : null;
    const target = core.hoverPoint ? core.toWorld(core.hoverPoint) : core.viewCenter();
    if (!items || !items.length) {
      // Not one of ours. Plain text is still something worth pasting, if there is
      // anything loaded that knows how to hold it.
      const line = String(text).replace(/\s+/g, ' ').trim();
      if (!line || !core.newText) return false;
      duplicateItems([core.newText(target, line)], 0, 0);
      return true;
    }
    const box = core.boundsOf(items);
    const dx = box ? target.x - (box.x + box.w / 2) : 0;
    const dy = box ? target.y - (box.y + box.h / 2) : 0;
    duplicateItems(items, dx, dy);
    return true;
  }

  // Leave the originals where they are and drag the copies instead.
  core.on('dragstart', (event) => {
    if (!event.altKey) return false;
    duplicateItems(selected(), 0, 0);
    return true;
  });

  // Copy and paste ride the browser's own events rather than a key handler: they
  // arrive with the real clipboard attached, and need no permission prompt.
  const inTextField = (event) => {
    const tag = event.target && event.target.tagName;
    return tag === 'TEXTAREA' || tag === 'INPUT';
  };

  core.listen(window, 'copy', (event) => {
    if (inTextField(event) || !event.clipboardData || !core.isActive()) return;
    const payload = { text: '' };
    if (core.fire('copytext', payload)) {         // a live caret copies its own run
      if (!payload.text) return;
    } else {
      payload.text = copySelection();
    }
    if (!payload.text) return;
    event.clipboardData.setData('text/plain', payload.text);
    event.preventDefault();
  });

  core.listen(window, 'paste', (event) => {
    if (inTextField(event) || !event.clipboardData || !core.isActive()) return;
    const text = event.clipboardData.getData('text/plain');
    if (core.fire('pastetext', { text: text })) { event.preventDefault(); return; }
    // Only fall back to our own buffer when the clipboard has no text of its own,
    // or pasting something copied elsewhere would silently paste the wrong thing.
    if (pasteText(text || clipboard)) event.preventDefault();
  });

  Object.assign(core.api, {
    duplicate: (dx, dy) => duplicateItems(selected(), dx || 0, dy || 0),
    copy: copySelection,
    paste: pasteText
  });
});


/* export — SVG for the archive, PNG for a picture. Both carry the document's own
   colours rather than whatever the current theme shows.
   Needs: core. */
createMiniCanvas.plugin('export', [], function (core) {
  const escapeXml = (text) =>
    String(text).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');

  function spinAttribute(item) {
    const fade = item.opacity !== undefined ? ` opacity="${item.opacity}"` : '';
    if (!item.angle) return fade;
    const middle = core.itemCenter(item);
    return ` transform="rotate(${item.angle} ${core.round(middle.x)} ${core.round(middle.y)})"` + fade;
  }

  // The archival exit: any browser, image viewer, or printer from now to 2125
  // can open the result without a line of JavaScript.
  function svgFor(items) {
    const box = core.boundsOf(items) || { x: 0, y: 0, w: 100, h: 100 };
    const body = items.map((item) => {
      const type = core.types[item.type];
      if (!type || !type.svg) return '';
      const open = type.svg(item, escapeXml) + spinAttribute(item);
      return type.svgTag
        ? `${open}>${type.svgBody(item, escapeXml)}</${type.svgTag}>`
        : `${open}/>`;
    }).filter(Boolean).join('\n  ');
    const pad = 8;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${box.x - pad} ${box.y - pad}`
         + ` ${box.w + pad * 2} ${box.h + pad * 2}">\n  ${body}\n</svg>`;
  }

  function toSVG() {
    core.fire('beforeexport');
    core.exporting = true;
    const markup = svgFor(core.scene.items);
    core.exporting = false;
    return markup;
  }

  // PNG is the one thing the browser will not do from elements. The canvas build
  // rendered a second time into an offscreen context; there is no second renderer
  // here, so the SVG above is drawn into an image and the image into a canvas.
  // That is a canvas as an encoder rather than as a renderer: it is handed a
  // finished picture and asked for bytes, and nothing about how the board draws
  // goes through it.
  //
  // Which makes it asynchronous, where the canvas build's was not: an image has to
  // load before anything can be read back out of it.
  function toPNG(items, pixelRatio) {
    core.fire('beforeexport');
    const list = (items && items.length) ? items : core.scene.items;
    const box = core.boundsOf(list);
    if (!box) return Promise.resolve(null);
    const ratio = pixelRatio || 2;
    const pad = 8;
    core.exporting = true;   // the document's own colours, not the ones the theme shows
    const markup = svgFor(list);
    core.exporting = false;

    return new Promise((resolve, reject) => {
      const picture = new Image();
      picture.onload = () => {
        const output = document.createElement('canvas');
        output.width = Math.max(1, Math.ceil((box.w + pad * 2) * ratio));
        output.height = Math.max(1, Math.ceil((box.h + pad * 2) * ratio));
        const context = output.getContext('2d');
        context.fillStyle = '#ffffff';   // an exported picture carries its own paper
        context.fillRect(0, 0, output.width, output.height);
        context.drawImage(picture, 0, 0, output.width, output.height);
        resolve(output);
      };
      picture.onerror = () => reject(new Error('minicanvas: the scene would not render to an image'));
      // A data URI rather than a blob URL: a blob URL is same-origin, and an SVG
      // loaded from one still taints the canvas in some browsers.
      picture.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(markup);
    });
  }

  Object.assign(core.api, { toSVG: toSVG, toPNG: toPNG });
});
</script>

<script>
/* Demo wiring. None of this belongs to the primitive; delete it when embedding. */
(function () {
  // Whatever was drawn last time, or the scene baked into the page the first time.
  // A page can hold several documents, so the scenes are kept one to a key with a
  // short index listing them. Names are in the index and nowhere else, so reading
  // the list costs one small read rather than parsing every scene on the page.
  const DOCS_KEY = 'minicanvas-demo-docs';
  const OLD_KEY = 'minicanvas-demo-scene';   // what the one-document version wrote
  const docKey = (id) => 'minicanvas-demo-doc:' + id;
  const store = (() => {
    try { window.localStorage.getItem(DOCS_KEY); return window.localStorage; }
    catch (error) { return null; }   // private mode, a sandboxed frame, or no storage at all
  })();

  const freshId = () => 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const EMPTY = '{"format":"minicanvas/1","items":[]}';
  const read = (key) => { try { return store && store.getItem(key); } catch (error) { return null; } };
  const write = (key, value) => { try { if (store) store.setItem(key, value); } catch (error) { /* full, or refused */ } };
  const docText = (id) => read(docKey(id));

  // Whether this browser has ever had a document here, read before the migration
  // below takes the old key away. An exported page arriving somewhere brand new
  // has no use for the empty document a first run would otherwise invent.
  const startedEmpty = !read(DOCS_KEY) && !read(OLD_KEY);

  // `name` is null until someone types one, and an unnamed document is called after
  // its own first line of text. A list of six things called Untitled is not a list.
  const docs = (() => {
    let index = null;
    try { index = JSON.parse(read(DOCS_KEY) || 'null'); } catch (error) { index = null; }
    if (index && Array.isArray(index.list) && index.list.length) return index;
    // First run, or a page saved before there were documents: whatever sat under
    // the old single-scene key becomes document one rather than being stranded.
    const id = freshId();
    const carried = read(OLD_KEY);
    if (carried) { write(docKey(id), carried); try { store.removeItem(OLD_KEY); } catch (error) { /* nothing to clear */ } }
    return { current: id, list: [{ id: id, name: null }] };
  })();

  // A page exported with a document baked into it carries that document's id. A
  // copy landing on a machine that already has documents of its own adds one
  // rather than replacing them or being ignored, and opening the same file twice
  // adopts it once: the second time the id is already known and whatever has been
  // drawn on it since is what opens.
  const sceneBlock = document.getElementById('scene');
  const shared = sceneBlock.getAttribute('data-document');
  if (shared && !docs.list.some((doc) => doc.id === shared)) {
    if (startedEmpty) docs.list.length = 0;   // nothing was in it and nothing put it there
    docs.list.push({ id: shared, name: sceneBlock.getAttribute('data-name') || null, used: Date.now() });
    write(docKey(shared), sceneBlock.textContent.trim());
    docs.current = shared;
  }

  let currentId = docs.list.some((doc) => doc.id === docs.current) ? docs.current : docs.list[0].id;
  const saveDocs = () => write(DOCS_KEY, JSON.stringify(docs));
  // The list is ordered by when you were last in a document, so the one you want
  // next is usually the one on top. Opening one stamps it; anything from before
  // there were stamps sorts to the bottom in the order it was written.
  const opened = docs.list.find((doc) => doc.id === currentId);
  if (opened) opened.used = Date.now();
  const byRecent = () => docs.list.slice().sort((a, b) => (b.used || 0) - (a.used || 0));
  saveDocs();   // a first run, or a migration, is written down before anything is drawn

  const board = MiniCanvas.mount('#board', {
    scene: docText(currentId) || '#scene',   // every feature on the page is loaded by default
    tool: 'draw'                             // which is what the toolbar starts out saying
  });

  const sceneText = document.getElementById('scene-text');
  const dump = () => { sceneText.value = board.toText(); };
  dump();

  function press(buttons, active) {
    buttons.forEach((button) => button.setAttribute('aria-pressed', String(button === active)));
  }
  const toolButtons = [...document.querySelectorAll('[data-tool]')];
  const widthButtons = [...document.querySelectorAll('[data-width]')];
  // The pen reports itself, so the keys and the buttons cannot fall out of step.
  const fillButton = document.getElementById('fill');
  const opacityButton = document.getElementById('opacity');
  const opacityValue = document.getElementById('opacity-value');
  fillButton.onclick = () => board.toggleFill();
  opacityButton.onclick = () => board.cycleOpacity();

  const colorButtons = [...document.querySelectorAll('[data-color]')];
  toolButtons.forEach((button) => button.onclick = () => board.setTool(button.dataset.tool));

  // The canvas announces tool changes, so v and the buttons stay in step.
  document.getElementById('board').addEventListener('penchange', (event) => {
    fillButton.setAttribute('aria-pressed', String(event.detail.fill));
    opacityValue.textContent = Math.round(event.detail.opacity * 100) + '%';
    press(colorButtons, colorButtons.find((button) => button.dataset.color === event.detail.color));
    press(widthButtons, widthButtons.find((button) => Number(button.dataset.width) === event.detail.width));
  });

  document.getElementById('board').addEventListener('toolchange', (event) => {
    press(toolButtons, toolButtons.find((button) => button.dataset.tool === event.detail));
  });

  // Picking a pen with something selected restyles it. With nothing selected you
  // are choosing what to draw next, so hand back the draw tool and get out of the way.
  function pickPen(color, width) {
    const restyling = board.selection().length > 0;
    board.setStroke(color, width);
    if (!restyling) board.setTool('draw');
  }
  widthButtons.forEach((button) => button.onclick = () => {
    pickPen(null, Number(button.dataset.width));
    press(widthButtons, button);
  });
  colorButtons.forEach((button) => button.onclick = () => {
    pickPen(button.dataset.color, null);
    press(colorButtons, button);
  });

  // Undo and redo change the scene without recording an edit, so they say so.
  document.getElementById('undo').onclick = () => { board.undo(); dump(); save(); };
  document.getElementById('redo').onclick = () => { board.redo(); dump(); save(); };
  document.getElementById('fit').onclick = () => board.fit();
  document.getElementById('dump').onclick = dump;
  document.getElementById('load').onclick = () => {
    try { board.load(sceneText.value); } catch (error) { alert('That is not valid JSON: ' + error.message); }
  };
  document.getElementById('reset').onclick = () => {
    board.load(document.getElementById('scene').textContent);   // this document only
    lastSaved = null;
    save();
    dump();
  };

  const scenePanel = document.getElementById('scene-panel');
  const sceneButton = document.getElementById('show-scene');
  function showScenePanel(showing) {
    scenePanel.hidden = !showing;
    sceneButton.setAttribute('aria-pressed', String(showing));
    if (showing) dump();
  }
  sceneButton.onclick = () => showScenePanel(scenePanel.hidden);

  // Saving on 'change' alone is not enough. That event fires when an edit is
  // *recorded*, which for a drag is the first frame of it: the item is where it
  // started, not where it was dropped. Typing never records a step at all after
  // the empty item is created, so nothing typed would ever be kept.
  //
  // So: save after anything that could have finished an edit, and compare the text
  // before writing, which makes the extra calls free when nothing actually moved.
  let lastSaved = board.toText();
  // The scene the page mounted with belongs to the open document even if nobody
  // has drawn on it yet. Without this first write it has no key of its own, and
  // the welcome scene would vanish the first time you switched away from it.
  if (!docText(currentId)) write(docKey(currentId), lastSaved);

  function save() {
    const text = board.toText();
    if (text === lastSaved) return;   // nothing changed since the last write
    lastSaved = text;
    write(docKey(currentId), text);
    stale = true;                     // the search index is now one edit behind
    paintDocName();                   // an unnamed document is named by its first line
    if (!scenePanel.hidden) dump();   // keep the panel honest, but never fight a typist
  }

  board.on('change', save);              // an edit was recorded
  // Anywhere, not just the canvas: undo and redo deliberately record no new edit,
  // so a click on those buttons raises nothing for 'change' to hear.
  window.addEventListener('pointerup', save);
  window.addEventListener('keyup', save);            // a keystroke landed
  window.addEventListener('blur', save);             // leaving the page
  window.addEventListener('beforeunload', save);
  function download(blob, name) {
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = name;
    link.click();
  }

  document.getElementById('svg').onclick = () =>
    download(new Blob([board.toSVG()], { type: 'image/svg+xml' }), 'canvas.svg');

  document.getElementById('json').onclick = () =>
    download(new Blob([board.toText()], { type: 'application/json' }), 'canvas.json');

  // The whole page, with this document baked into it. Not a scene and not a
  // picture: one file that opens in any browser with no server, no storage and
  // nothing to send alongside it. The scene block was always the thing that let
  // the data outlive the script; this writes one on purpose.
  const slug = (text) =>
    text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'canvas';

  function pageWithScene() {
    const page = document.documentElement.cloneNode(true);
    const at = (selector) => page.querySelector(selector);
    // Whatever the chrome happened to be doing when the button was pressed is not
    // part of the document, so it all goes back the way the source file has it.
    ['#doc-panel', '#search-panel', '#scene-panel', '#download-menu']
      .forEach((selector) => at(selector).setAttribute('hidden', ''));
    at('#doc-list').textContent = '';
    at('#search-list').textContent = '';
    // The board's own layers are a rendering of the scene, not part of the page.
    // Left in, they would ship as dead markup and the copy would draw everything
    // twice: once as the corpse, once as the scene it renders on load.
    at('#board').textContent = '';
    at('#doc-button').removeAttribute('hidden');
    at('#doc-button').setAttribute('aria-expanded', 'false');
    at('#download').setAttribute('aria-expanded', 'false');
    at('#show-scene').setAttribute('aria-pressed', 'false');
    at('#toolbar').classList.remove('away');
    at('#peek').classList.remove('here');
    at('#doc-button').classList.remove('away');
    at('#search-button').classList.remove('away');
    at('#tip').classList.remove('here');
    // The tooltip and the menu are placed by hand, and their coordinates belong to
    // a window that is not the one this file will open in.
    at('#tip').removeAttribute('style');
    at('#download-menu').removeAttribute('style');


    const name = titleOf(docById(currentId));
    at('title').textContent = name;
    const block = at('#scene');
    // A note that spells out a closing script tag would end the block early, and
    // this comment may not spell one out either. JSON reads <\/ as a plain slash,
    // so escaping every </ costs whoever opens the file nothing.
    block.textContent = '\n  ' + board.toText().replace(/<\//g, '<\\/') + '\n';
    block.setAttribute('data-document', currentId);
    block.setAttribute('data-name', name);
    return '<!doctype html>\n' + page.outerHTML + '\n';
  }

  document.getElementById('html').onclick = () =>
    download(new Blob([pageWithScene()], { type: 'text/html' }),
      slug(titleOf(docById(currentId))) + '.html');

  // The toolbar follows the selection: making things while something is picked is
  // not what you are doing, and acting on things you have not picked is not either.
  // The canvas says what is selected and the toolbar decides what that means.
  const toolGroup = document.getElementById('tool-group');
  const historyGroup = document.getElementById('history-group');
  const sceneGroup = document.getElementById('scene-group');
  const viewGroup = document.getElementById('view-group');
  const orderTools = document.getElementById('order-tools');
  const alignTools = document.getElementById('align-tools');
  const groupTools = document.getElementById('group-tools');
  const groupButton = document.getElementById('group');

  document.getElementById('board').addEventListener('selectionchange', (event) => {
    const picked = event.detail.items > 0;
    const grouped = board.isGrouped();
    toolGroup.hidden = picked;      // deselect to get the tools back
    historyGroup.hidden = picked;
    sceneGroup.hidden = picked;
    viewGroup.hidden = picked;
    orderTools.hidden = !picked;                 // layer order needs one item
    alignTools.hidden = event.detail.units < 2;  // alignment needs two things
    // Two units to join, or one group to take apart. Nothing to do with one
    // loose item, which can neither be grouped with itself nor ungrouped.
    groupTools.hidden = event.detail.units < 2 && !grouped;
    groupButton.setAttribute('aria-pressed', String(grouped));
    groupButton.dataset.tip = (grouped ? 'Ungroup · ⌘G' : 'Group · ⌘G');
    groupButton.setAttribute('aria-label', grouped ? 'Ungroup' : 'Group');
    // Only rectangles and ovals can be filled, so the button only appears when one
    // of those is picked. The F key still arms the pen with nothing selected.
    fillButton.hidden = !board.selection().some(
      (item) => item.type === 'rect' || item.type === 'oval');
  });

  [...document.querySelectorAll('[data-align]')].forEach((button) => button.onclick = () =>
    board.align(button.dataset.align.split(',').map(Number)));
  [...document.querySelectorAll('[data-center]')].forEach((button) => button.onclick = () =>
    board.center(button.dataset.center));
  [...document.querySelectorAll('[data-order]')].forEach((button) => button.onclick = () =>
    board.reorder(Number(button.dataset.order)));
  groupButton.onclick = () => board.toggleGroup();

  // One download button, three formats. The menu is placed by the same code that
  // places the tooltip, since both have to escape the scrolling toolbar.
  const downloadButton = document.getElementById('download');
  const downloadMenu = document.getElementById('download-menu');
  function showMenu(showing) {
    downloadMenu.hidden = !showing;
    downloadButton.setAttribute('aria-expanded', String(showing));
    if (showing) floatAbove(downloadMenu, downloadButton);
  }
  downloadButton.onclick = () => showMenu(downloadMenu.hidden);
  downloadMenu.onclick = () => showMenu(false);   // whichever format was picked, we are done
  window.addEventListener('pointerdown', (event) => {
    // A press inside the menu must not close it. Hiding on pointerdown takes the
    // button away before the click lands, so the click never happens and nothing
    // downloads. The button itself is exempt too, or its own press would close the
    // menu a moment before its click reopened it.
    const target = event.target;
    if (target && target.closest && target.closest('#download-menu, #download')) return;
    showMenu(false);
  });
  window.addEventListener('keydown', (event) => { if (event.key === 'Escape') showMenu(false); });

  // Exports the selection, or the whole scene when nothing is selected.
  // Asynchronous here, unlike the canvas build: a PNG is made by drawing the SVG
  // export into an image, and an image has to load first.
  document.getElementById('png').onclick = () => {
    board.toPNG(board.selection(), 2).then((rendered) => {
      if (!rendered) { alert('Nothing to export yet.'); return; }
      rendered.toBlob((blob) => download(blob, 'canvas.png'), 'image/png');
    }).catch(() => {
      // A canvas holding an image from another origin cannot be read back out.
      alert('This scene has an image from another site, which browsers refuse to export. '
          + 'Paste or drop the image in instead of linking it.');
    });
  };

  // Images: file picker, paste, or drop. Each becomes a data URL so the scene
  // stays self-contained. Point `src` at a relative path instead for small files.
  function readAsDataURL(file, world) {
    const reader = new FileReader();
    reader.onload = () => board.addImage(reader.result, world);
    reader.readAsDataURL(file);
  }
  const picker = document.createElement('input');
  picker.type = 'file';
  picker.accept = 'image/*';
  picker.onchange = () => { if (picker.files[0]) readAsDataURL(picker.files[0]); picker.value = ''; };
  document.getElementById('add-image').onclick = () => picker.click();

  // ⌘/Ctrl+U opens the same picker the button does. Some browsers reserve this
  // combination for view-source and never let it reach the page at all, in which
  // case the button and paste are still there.
  window.addEventListener('keydown', (event) => {
    if (!(event.ctrlKey || event.metaKey)) return;
    if (event.key.toLowerCase() !== 'u' && event.code !== 'KeyU') return;
    event.preventDefault();
    picker.click();
  });

  window.addEventListener('paste', (event) => {
    for (const item of event.clipboardData.files) readAsDataURL(item);
  });
  window.addEventListener('dragover', (event) => event.preventDefault());
  window.addEventListener('drop', (event) => {
    event.preventDefault();
    for (const file of event.dataTransfer.files) readAsDataURL(file);
  });

  // A tooltip lives outside the toolbar so the bar can scroll without clipping it,
  // which means placing it by hand against whatever is hovered.
  const tip = document.getElementById('tip');
  function floatAbove(element, anchor) {
    const box = anchor.getBoundingClientRect();
    element.hidden = false;
    const width = element.offsetWidth || 0;
    element.style.left = Math.round(Math.max(8, Math.min(window.innerWidth - width - 8,
      box.left + box.width / 2 - width / 2))) + 'px';
    element.style.top = Math.round(box.top - (element.offsetHeight || 0) - 8) + 'px';
  }
  function showTip(target) {
    if (!target || !target.dataset || !target.dataset.tip) { tip.classList.remove('here'); return; }
    tip.textContent = target.dataset.tip;
    floatAbove(tip, target);
    tip.classList.add('here');
  }
  document.body.addEventListener('pointerover', (event) =>
    showTip(event.target.closest ? event.target.closest('[data-tip]') : null));
  document.body.addEventListener('pointerout', () => tip.classList.remove('here'));
  document.body.addEventListener('pointerdown', () => tip.classList.remove('here'));

  // --- documents ------------------------------------------------------------
  // The primitive holds one scene. How many of them a page keeps is the page's
  // business, so all of this is wiring around it: switching documents is a save
  // and a load, and nothing here reaches inside the canvas to do it.
  const docButton = document.getElementById('doc-button');
  const docLabel = document.getElementById('doc-name');
  const docPanel = document.getElementById('doc-panel');
  const docFilter = document.getElementById('doc-filter');
  const docList = document.getElementById('doc-list');

  const docById = (id) => docs.list.find((doc) => doc.id === id);
  const sceneOf = (id) => {
    if (id === currentId) return board.scene();     // the open one is live, not stored
    try { return JSON.parse(docText(id) || EMPTY); } catch (error) { return null; }
  };

  // What a document is called when nobody has named it: its own first line, the
  // way a note names itself. A list of six things called Untitled is not a list.
  function firstLine(scene) {
    for (const item of (scene && scene.items) || []) {
      if (item.type !== 'text') continue;
      const line = String(item.text || '').split('\n').find((part) => part.trim());
      if (line) return line.trim().slice(0, 40);
    }
    return '';
  }
  const nameOf = (doc, scene) => doc.name || firstLine(scene) || 'Untitled';
  const titleOf = (doc) => nameOf(doc, sceneOf(doc.id));

  function paintDocName() { docLabel.textContent = titleOf(docById(currentId)); }

  function loadCurrent() {
    try { board.load(docText(currentId) || EMPTY); }
    catch (error) { board.load(EMPTY); }   // a corrupt key is an empty page, not a dead one
    lastSaved = board.toText();
    paintDocName();
    dump();
  }

  function openDoc(id) {
    showDocs(false);
    const doc = docById(id);
    if (doc) doc.used = Date.now();
    if (id === currentId) { saveDocs(); return; }
    save();                       // what is on screen belongs to the document it came from
    currentId = docs.current = id;
    saveDocs();
    loadCurrent();
  }

  function dropDoc(id) {
    const doc = docById(id);
    if (!doc || docs.list.length < 2) return;   // there is always one document
    if (!window.confirm('Delete "' + titleOf(doc) + '"? This cannot be undone.')) return;
    docs.list = docs.list.filter((entry) => entry.id !== id);
    try { if (store) store.removeItem(docKey(id)); } catch (error) { /* already gone */ }
    stale = true;
    if (id === currentId) {
      currentId = docs.current = byRecent()[0].id;   // whatever you were in most recently
      loadCurrent();
    }
    saveDocs();
    paintDocs();
  }

  // The same markup the static buttons have, pointing at the same sprite.
  function sideButton(icon, label, action) {
    const button = document.createElement('button');
    button.className = 'side';
    button.title = label;
    button.setAttribute('aria-label', label);
    button.innerHTML = '<svg class="icon" aria-hidden="true"><use></use></svg>';
    button.querySelector('use').setAttribute('href', '#i-' + icon);
    button.onclick = action;
    return button;
  }

  // One editor for both jobs: naming a new document and renaming an old one. The
  // row becomes a field and a check mark, and Enter does what the check mark does.
  // A name is the whole point of the state, so an empty one is not a way out of it:
  // the check mark hands focus back rather than saving nothing.
  function editName(row, value, commit, cancel) {
    row.textContent = '';
    row.className = 'doc-row editing';
    const field = document.createElement('input');
    field.className = 'field';
    field.placeholder = 'Document name';
    field.spellcheck = false;
    field.value = value;
    let over = false;
    const finish = (keep) => {
      if (over) return;
      const name = field.value.trim();
      if (keep && !name) { field.focus(); return; }
      over = true;
