      if (keep) commit(name); else cancel();
      docFilter.focus();
    };
    const done = sideButton('check', 'Save name', () => finish(true));
    // Pressing the check mark must not take focus off the field, or the blur below
    // would fire first and decide the question before the click ever landed.
    done.onmousedown = (event) => event.preventDefault();
    field.onkeydown = (event) => {
      if (event.key === 'Enter') { finish(true); event.preventDefault(); }
      if (event.key === 'Escape') { event.stopPropagation(); finish(false); }
    };
    // Clicking away keeps a name you had typed and abandons an empty one, which is
    // the reading that loses nobody's work either way.
    field.onblur = () => finish(!!field.value.trim());
    row.appendChild(field);
    row.appendChild(done);
    field.focus();
    field.select();
  }

  function startRename(doc, row) {
    editName(row, titleOf(doc), (name) => {
      doc.name = name;
      saveDocs();
      stale = true;
      if (doc.id === currentId) paintDocName();
      paintDocs();
    }, paintDocs);
  }

  // A new document is named before it exists. Nothing is written until the name is,
  // so backing out leaves no empty document behind to be tidied up later.
  function startNewDoc() {
    const row = document.createElement('div');
    row.className = 'doc-row';
    docList.insertBefore(row, docList.firstChild);   // where it will sit once it is real
    editName(row, '', (name) => {
      const doc = { id: freshId(), name: name, used: Date.now() };
      docs.list.push(doc);
      write(docKey(doc.id), EMPTY);
      stale = true;
      openDoc(doc.id);              // which closes the panel and saves the index
    }, paintDocs);
  }

  function paintDocs() {
    const filter = docFilter.value.trim().toLowerCase();
    docList.textContent = '';
    for (const doc of byRecent()) {
      const title = titleOf(doc);
      if (filter && title.toLowerCase().indexOf(filter) < 0) continue;
      const row = document.createElement('div');
      row.className = 'doc-row';
      const pick = document.createElement('button');
      pick.className = 'pick';
      pick.dataset.pick = '';
      pick.setAttribute('aria-current', String(doc.id === currentId));
      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = title;
      pick.appendChild(label);
      pick.onclick = () => openDoc(doc.id);
      row.appendChild(pick);
      const sides = document.createElement('span');
      sides.className = 'sides';
      sides.appendChild(sideButton('edit', 'Rename', () => startRename(doc, row)));
      // Nothing to delete when there is one document: the page would have no scene
      // to show and would have to invent one.
      if (docs.list.length > 1) {
        sides.appendChild(sideButton('close', 'Delete', () => dropDoc(doc.id)));
      }
      row.appendChild(sides);
      docList.appendChild(row);
    }
    const add = document.createElement('button');
    add.className = 'pick new';
    add.dataset.pick = '';
    add.textContent = '+ New document';
    add.onclick = startNewDoc;
    docList.appendChild(add);
    docNav.reset();
  }

  // --- search ---------------------------------------------------------------
  // Every document's name and every text item in every document, matched as you
  // type. The index is a trie over each word and each of that word's suffixes, so
  // "plan" and "ann" both reach "planning" without walking the corpus.
  //
  // The trie is a filter rather than an answer: it narrows to candidates and a
  // plain indexOf confirms each one. That is what lets it stop ten characters
  // deep and stay small, since a longer query is only ever narrowed further by
  // the characters the trie never stored.
  //
  // ponytail: suffixes are indexed only for the first WORD_REACH characters of a
  // word, which is the wrong trade for a language that does not put spaces
  // between words. A real corpus wants a suffix array or an inverted index with
  // positions; a page of notes does not. An embedding model would want megabytes
  // of weights over the network, which the no-dependencies rule settles.
  const DEPTH = 10;        // characters of a word the trie actually stores
  const WORD_REACH = 40;   // how far into a long word its suffixes are indexed
  const WORDS = /[^\p{L}\p{N}]+/u;
  const trie = { kids: null, post: null };
  let entries = [];
  let stale = true;

  const searchButton = document.getElementById('search-button');
  const searchPanel = document.getElementById('search-panel');
  const searchField = document.getElementById('search-field');
  const searchList = document.getElementById('search-list');

  function addWord(word, from, id) {
    let node = trie;
    for (let at = from; at < word.length && at - from < DEPTH; at++) {
      const kids = node.kids || (node.kids = Object.create(null));
      node = kids[word[at]] || (kids[word[at]] = { kids: null, post: null });
      const post = node.post || (node.post = []);
      // Entries go in one at a time, so a repeat of the same id is always the one
      // already on the end. No set, no sort, no duplicates.
      if (post[post.length - 1] !== id) post.push(id);
    }
  }

  function addEntry(entry) {
    entry.low = entry.text.toLowerCase();
    const id = entries.push(entry) - 1;
    for (const word of entry.low.split(WORDS)) {
      for (let at = 0; at < word.length && at < WORD_REACH; at++) addWord(word, at, id);
    }
  }

  function buildIndex() {
    entries = [];
    trie.kids = null;
    for (const doc of docs.list) {
      const scene = sceneOf(doc.id);
      const title = nameOf(doc, scene);
      addEntry({ docId: doc.id, title: title, text: title, kind: 'name' });
      ((scene && scene.items) || []).forEach((item, at) => {
        if (item.type !== 'text' || !item.text) return;
        addEntry({ docId: doc.id, title: title, text: String(item.text), kind: 'text', at: at });
      });
    }
    stale = false;
  }

  function lookup(token) {
    let node = trie;
    for (let at = 0; at < token.length && at < DEPTH; at++) {
      if (!node.kids) return null;
      node = node.kids[token[at]];
      if (!node) return null;
    }
    return node.post;
  }

  function search(query) {
    const tokens = query.toLowerCase().split(/\s+/).filter(Boolean);
    if (!tokens.length) return [];
    if (stale) buildIndex();
    // Every word has to be somewhere in the entry, so the candidate lists narrow
    // each other before anything is read.
    let pool = null;
    for (const token of tokens) {
      const found = lookup(token);
      if (!found) return [];
      if (!pool) { pool = found.slice(); continue; }
      const narrow = new Set(found);
      pool = pool.filter((id) => narrow.has(id));
      if (!pool.length) return [];
    }
    const hits = [];
    for (const id of pool) {
      const entry = entries[id];
      let score = entry.kind === 'name' ? 40 : 0;   // a document is more than a line in one
      let matched = true;
      for (const token of tokens) {
        const at = entry.low.indexOf(token);        // the trie narrows; this decides
        if (at < 0) { matched = false; break; }
        // A word you started typing beats one you landed in the middle of.
        score += (at === 0 || WORDS.test(entry.low[at - 1])) ? 10 : 2;
      }
      if (matched) hits.push({ entry: entry, score: score });
    }
    hits.sort((a, b) => b.score - a.score);
    return hits.slice(0, 50).map((hit) => hit.entry);
  }

  // A window around the first match, since a text item can be a paragraph and a
  // result row is a line.
  function snippet(text, tokens) {
    const flat = text.replace(/\s+/g, ' ').trim();
    const low = flat.toLowerCase();
    let at = -1;
    for (const token of tokens) {
      const found = low.indexOf(token);
      if (found >= 0 && (at < 0 || found < at)) at = found;
    }
    const from = at < 30 ? 0 : at - 25;
    const REACH = 140;   // as much of the line as the panel is wide enough to read
    return (from ? '…' : '') + flat.slice(from, from + REACH) + (flat.length > from + REACH ? '…' : '');
  }

  // Built out of nodes rather than a string of HTML: what is being marked up here
  // is somebody's notes, and notes are allowed to contain angle brackets.
  function paintMatch(node, text, tokens) {
    const low = text.toLowerCase();
    const hits = [];
    for (const token of tokens) {
      for (let at = low.indexOf(token); at >= 0; at = low.indexOf(token, at + token.length)) {
        hits.push([at, at + token.length]);
      }
    }
    hits.sort((a, b) => a[0] - b[0]);
    let cursor = 0;
    for (const [from, to] of hits) {
      if (from < cursor) continue;              // overlapping words: the first one wins
      node.appendChild(document.createTextNode(text.slice(cursor, from)));
      const mark = document.createElement('mark');
      mark.textContent = text.slice(from, to);
      node.appendChild(mark);
      cursor = to;
    }
    node.appendChild(document.createTextNode(text.slice(cursor)));
  }

  // Put the found item in the middle of the window and select it, so the answer to
  // "where is that" is the thing outlined in front of you.
  function focusItem(at) {
    const item = board.scene().items[at];
    if (!item) return;
    const box = board.core.boundsOf([item]);
    if (!box) return;
    const view = board.scene().view;
    view.scale = Math.max(0.5, Math.min(view.scale, 2));   // legible, without a jump either way
    view.x = box.x + box.w / 2 - board.core.canvas.clientWidth / 2 / view.scale;
    view.y = box.y + box.h / 2 - board.core.canvas.clientHeight / 2 / view.scale;
    if (board.core.selection) {
      board.core.selection.clear();
      board.core.selection.add(item);
    }
    board.redraw();
  }

  function go(entry) {
    showSearch(false);
    if (entry.docId !== currentId) openDoc(entry.docId);
    if (entry.kind === 'text') focusItem(entry.at);
  }

  function paintResults() {
    const tokens = searchField.value.toLowerCase().split(/\s+/).filter(Boolean);
    searchList.textContent = '';
    if (!tokens.length) { searchNav.reset(); return; }
    const found = search(searchField.value);
    if (!found.length) {
      const nothing = document.createElement('div');
      nothing.className = 'empty';
      nothing.textContent = 'No matches';
      searchList.appendChild(nothing);
      searchNav.reset();
      return;
    }
    for (const entry of found) {
      const pick = document.createElement('button');
      pick.className = 'pick';
      pick.dataset.pick = '';
      const label = document.createElement('span');
      label.className = 'label';
      paintMatch(label, snippet(entry.text, tokens), tokens);
      const where = document.createElement('span');
      where.className = 'where';
      where.textContent = entry.kind === 'name' ? 'document' : entry.title;
      pick.appendChild(label);
      pick.appendChild(where);
      pick.onclick = () => go(entry);
      searchList.appendChild(pick);
    }
    searchNav.reset();
  }

  // --- opening and closing --------------------------------------------------
  function showDocs(showing) {
    docPanel.hidden = !showing;
    docButton.hidden = showing;      // the panel opens where the name was
    docButton.setAttribute('aria-expanded', String(showing));
    if (!showing) return;
    showSearch(false);
    docFilter.value = '';
    paintDocs();
    docFilter.focus();
  }

  function showSearch(showing) {
    searchPanel.hidden = !showing;
    if (!showing) return;
    showDocs(false);
    if (stale) buildIndex();
    paintResults();
    searchField.focus();
    searchField.select();
  }

  // Both panels are a field, a list, arrows and Enter. One helper, so the two
  // cannot drift apart.
  function navigable(field, list, close) {
    let at = 0;
    const rows = () => [...list.querySelectorAll('[data-pick]')];
    const mark = (items) => items.forEach((row, index) =>
      row.setAttribute('aria-selected', String(index === at)));
    field.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') { event.stopPropagation(); close(); return; }
      const items = rows();
      if (!items.length) return;
      at = Math.min(at, items.length - 1);
      if (event.key === 'Enter') { items[at].click(); event.preventDefault(); return; }
      const step = event.key === 'ArrowDown' ? 1 : event.key === 'ArrowUp' ? -1 : 0;
      if (!step) return;
      at = (at + step + items.length) % items.length;
      mark(items);
      items[at].scrollIntoView({ block: 'nearest' });
      event.preventDefault();
    });
    return { reset: () => { at = 0; mark(rows()); } };
  }
  const docNav = navigable(docFilter, docList, () => showDocs(false));
  const searchNav = navigable(searchField, searchList, () => showSearch(false));

  docButton.onclick = () => showDocs(true);
  searchButton.onclick = () => showSearch(searchPanel.hidden);
  docFilter.oninput = paintDocs;
  searchField.oninput = paintResults;

  // ⌘space and ⌘K both open the search, hidden toolbar or not. Caught in the
  // capture phase because the canvas reads Space as a pan and would take the
  // cursor with it on the way past. Two keys rather than one because ⌘space is
  // Spotlight on macOS and often never reaches the page at all.
  window.addEventListener('keydown', (event) => {
    if (!(event.ctrlKey || event.metaKey)) return;
    const wanted = event.code === 'Space' || event.key === ' '
                || event.code === 'KeyK' || (event.key || '').toLowerCase() === 'k';
    if (!wanted) return;
    event.preventDefault();
    event.stopPropagation();
    showSearch(true);
  }, true);

  window.addEventListener('keydown', (event) => {
    if (event.key !== 'Escape') return;
    showDocs(false);
    showSearch(false);
  });

  // A press anywhere else puts them away, the same as the download menu.
  window.addEventListener('pointerdown', (event) => {
    const target = event.target;
    if (!target || !target.closest) return;
    if (!target.closest('#doc-panel, #doc-button')) showDocs(false);
    if (!target.closest('#search-panel, #search-button')) showSearch(false);
  });

  paintDocName();

  // ⌘. gets the chrome out of the way. The bar and the pill that brings it back
  // are the same toggle, so there is only one piece of state to be wrong about.
  const toolbar = document.getElementById('toolbar');
  const peek = document.getElementById('peek');
  const showToolbar = (showing) => {
    toolbar.classList.toggle('away', !showing);
    peek.classList.toggle('here', !showing);
    // The document name and the search button are chrome too, and ⌘. means all of
    // it. The search panel itself is not: ⌘space still opens it from a bare page.
    docButton.classList.toggle('away', !showing);
    searchButton.classList.toggle('away', !showing);
    if (!showing) { showDocs(false); showSearch(false); }
  };
  const hideButton = document.getElementById('hide');
  hideButton.onclick = () => showToolbar(false);
  peek.onclick = () => showToolbar(true);
  window.addEventListener('keydown', (event) => {
    if (!(event.ctrlKey || event.metaKey)) return;
    if (event.key !== '.' && event.code !== 'Period') return;
    showToolbar(toolbar.classList.contains('away'));
    event.preventDefault();
  });

  // Which tool, which pen, and what the chrome looked like. Kept under its own key:
  // this is how the page was left, not what was drawn, and the two are worth being
  // able to clear apart from each other.
  const UI_KEY = 'minicanvas-demo-toolbar';

  function saveToolbar() {
    if (!store) return;
    const pen = board.pen();
    try {
      store.setItem(UI_KEY, JSON.stringify({
        tool: board.tool(),
        color: pen.color, width: pen.width, opacity: pen.opacity, fill: pen.fill,
        toolbar: !toolbar.classList.contains('away'),
        panel: !scenePanel.hidden
      }));
    } catch (error) { /* full, or refused */ }
  }

  function restoreToolbar() {
    let state = null;
    try { state = JSON.parse((store && store.getItem(UI_KEY)) || 'null'); }
    catch (error) { state = null; }   // whatever is in there, it is not ours
    if (!state) return;
    // Opacity and fill have no setter of their own, so they go on directly and
    // setStroke does the announcing for all four at once.
    if (typeof state.opacity === 'number') board.core.strokeOpacity = state.opacity;
    board.core.fillOn = !!state.fill;
    board.setStroke(state.color, state.width);
    if (state.tool) board.setTool(state.tool);
    showToolbar(state.toolbar !== false);
    showScenePanel(!!state.panel);
  }

  // The toolbar follows the canvas rather than tracking a tool of its own, so
  // whatever tool the board is actually on gets the pressed button — with or
  // without anything saved to restore. Without this a first visit, and every copy
  // of an exported page, shows a pressed tool that is not the one in hand.
  function syncTool() {
    press(toolButtons, toolButtons.find((button) => button.dataset.tool === board.tool()));
  }

  restoreToolbar();
  syncTool();
  board.on('toolchange', saveToolbar);
  board.on('penchange', saveToolbar);
  hideButton.onclick = () => { showToolbar(false); saveToolbar(); };
  peek.onclick = () => { showToolbar(true); saveToolbar(); };
  sceneButton.onclick = () => { showScenePanel(scenePanel.hidden); saveToolbar(); };
  window.addEventListener('keyup', saveToolbar);   // ⌘. and the letter shortcuts
})();
</script>

</html>
