<!-- No font, and no network at all: the icons are an SVG sprite further down the
     page. Every icon button keeps its aria-label all the same, since a picture is
     not a name. -->

<style>
  /* Every colour is oklch, with a hex declared first so a browser older than oklch
     still gets the right thing: it drops the declaration it cannot parse and keeps
     the hex. Dark mode holds each hue and chroma and moves only the lightness, so
     the palette reads as the same six pens either way. */
  :root {
    --ink: #17171a;                          --ink: oklch(0.20 0.005 285);
    --chrome: #f6f6f4;                       --chrome: oklch(0.97 0.002 285);
    --surface: #ffffff;                      --surface: oklch(1 0 0);
    --rule: #e0e0dc;                         --rule: oklch(0.90 0.003 285);
    --edge: rgba(0,0,0,.2);                  --edge: oklch(0 0 0 / 0.2);
    --paper: #ffffff;                        --paper: oklch(1 0 0);
    --handle-fill: #ffffff;                  --handle-fill: oklch(1 0 0);
    --selection: #1a73ff;                    --selection: oklch(0.60 0.21 258);
    --selection-tint: rgba(26,115,255,.28);  --selection-tint: oklch(0.60 0.21 258 / 0.28);
    --marquee: #a8a8a4;                      --marquee: oklch(0.74 0.003 285);
    --marquee-fill: rgba(120,120,116,.12);   --marquee-fill: oklch(0.62 0.003 285 / 0.12);
    --shadow: rgba(0,0,0,.14);               --shadow: oklch(0 0 0 / 0.14);
    /* The six pens. Stored files hold the light hex; the renderer looks the colour
       up here at draw time, which is how a dark theme reaches inside the canvas. */
    --pen-ink: #17171a;                      --pen-ink: oklch(0.20 0.005 285);
    --pen-red: #c0392b;                      --pen-red: oklch(0.53 0.17 27);
    --pen-amber: #d98c1f;                    --pen-amber: oklch(0.70 0.14 68);
    --pen-green: #2e8b57;                    --pen-green: oklch(0.55 0.12 155);
    --pen-blue: #1f6feb;                     --pen-blue: oklch(0.56 0.19 258);
    --pen-violet: #6b4de6;                   --pen-violet: oklch(0.53 0.22 285);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e9e8e4;                          --ink: oklch(0.93 0.004 285);
      --chrome: #131316;                       --chrome: oklch(0.18 0.004 285);
      --surface: #1e1e22;                      --surface: oklch(0.24 0.005 285);
      --rule: #34343a;                         --rule: oklch(0.33 0.006 285);
      --edge: rgba(255,255,255,.28);           --edge: oklch(1 0 0 / 0.28);
      --paper: #1a1a1e;                        --paper: oklch(0.21 0.005 285);
      --handle-fill: #1a1a1e;                  --handle-fill: oklch(0.21 0.005 285);
      --selection: #6fa8ff;                    --selection: oklch(0.74 0.15 258);
      --selection-tint: rgba(111,168,255,.30); --selection-tint: oklch(0.74 0.15 258 / 0.30);
      --marquee: #6a6a72;                      --marquee: oklch(0.52 0.005 285);
      --marquee-fill: rgba(190,190,200,.14);   --marquee-fill: oklch(0.80 0.004 285 / 0.14);
      --shadow: rgba(0,0,0,.5);                --shadow: oklch(0 0 0 / 0.5);
      --pen-ink: #ecebe7;                      --pen-ink: oklch(0.94 0.004 285);
      --pen-red: #ff8b7a;                      --pen-red: oklch(0.74 0.15 27);
      --pen-amber: #e8b872;                    --pen-amber: oklch(0.82 0.12 68);
      --pen-green: #74c79a;                    --pen-green: oklch(0.78 0.12 155);
      --pen-blue: #85b3ff;                     --pen-blue: oklch(0.76 0.14 258);
      --pen-violet: #b4a3ff;                   --pen-violet: oklch(0.76 0.15 285);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; background: var(--chrome); color: var(--ink);
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  #board { position: absolute; inset: 0; width: 100%; height: 100%;
           background: var(--paper); touch-action: none; }

  /* The toolbar floats over the canvas rather than pushing it down, so the drawing
     surface is the whole window and the chrome is a thing on top of it. */
  /* Centred without a transform, so nothing here becomes a containing block: the
     tooltip is fixed-positioned and needs to escape this element's clipping. */
  #toolbar {
    position: fixed; bottom: 16px; left: 12px; right: 12px;
    margin: 0 auto; width: fit-content; max-width: calc(100vw - 24px);
    display: flex; flex-wrap: nowrap; align-items: center; gap: 2px;
    padding: 6px; overflow-x: auto; overscroll-behavior-x: contain;
    scrollbar-width: none;
    background: var(--surface); border: 1px solid var(--rule); border-radius: 10px;
    box-shadow: 0 6px 24px var(--shadow);
    transition: opacity .15s ease, transform .15s ease;
  }
  #toolbar::-webkit-scrollbar { display: none; }
  /* Nothing in the bar may shrink or wrap: too much content scrolls sideways
     rather than folding onto a second line. */
  #toolbar > *, .group > * { flex: 0 0 auto; }
  #toolbar.away { opacity: 0; transform: translateY(16px); pointer-events: none; }
  #peek {
    position: fixed; bottom: 16px; left: 12px; right: 12px; margin: 0 auto;
    width: fit-content; opacity: 0; pointer-events: none; transition: opacity .15s ease;
  }
  #peek.here { opacity: .8; pointer-events: auto; }

  .divider { width: 1px; align-self: stretch; margin: 2px 5px; background: var(--rule); }
  #swatches { display: flex; align-items: center; gap: 6px; }

  button {
    font: inherit; color: inherit;
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    height: 30px; padding: 0 8px;
    border: 1px solid transparent; border-radius: 7px;
    background: transparent; cursor: pointer;
  }
  /* An icon button is a square: the icon is the whole label. */
  button:has(> .icon) { width: 30px; padding: 0; }
  /* Fixed width is what stops the jump; tabular-nums keeps the digits themselves
     steady too, and the width is sized for icon + gap + the widest label. The
     square-icon-button rule below also matches this button, since it starts with
     an icon too, so width and padding are restated here to win on specificity. */
  #opacity { width: 74px; padding: 0 8px; font-variant-numeric: tabular-nums; }
  /* `button` sets a display, which beats the browser's own [hidden] rule, so any
     button that hides itself has to be told again here. */
  button[hidden] { display: none; }
  button:hover { background: var(--chrome); }
  button:focus-visible { outline: 2px solid var(--selection); outline-offset: 1px; }
  button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }

  /* The sprite is a definition, not a picture: it is pointed at, never shown. */
  .sprite { display: none; }

  /* Colour comes from the button, which is what lets a pressed one invert
     without the icon knowing anything about it: every glyph is one fill and
     inherits it. */
  .icon {
    width: 20px; height: 20px; flex: 0 0 auto; display: block;
    fill: currentColor;
  }

  .swatch {
    width: 22px; min-width: 22px; height: 22px; padding: 0;
    border-radius: 50%; border: 1px solid var(--edge);
  }
  .swatch[aria-pressed="true"] { background: none;
    box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--ink); }

  /* Tooltips carry the name and the shortcut, so the icons stay learnable without
     a legend taking up room. One fixed element rather than a pseudo-element on each
     button: the bar scrolls, and anything drawn inside it would be clipped by that. */
  #tip {
    position: fixed; z-index: 5; padding: 4px 8px; border-radius: 5px;
    background: var(--ink); color: var(--surface);
    font-size: 11px; white-space: nowrap; pointer-events: none;
    opacity: 0; transition: opacity .1s ease;
  }
  #tip.here { opacity: 1; }

  /* A group is only a wrapper for showing and hiding: display:contents keeps its
     buttons as direct flex children of the bar, so grouping changes nothing about
     the layout until something is hidden. */
  .group { display: contents; }
  .group[hidden] { display: none; }

  /* The scene, as data, in the corner. Out of the way until the button asks for it.
     It starts below the search button rather than beside it: the top-right corner
     belongs to the search now. */
  #scene-panel {
    position: fixed; top: 52px; right: 12px; width: min(400px, calc(100vw - 24px));
    background: var(--surface); border: 1px solid var(--rule); border-radius: 8px;
    box-shadow: 0 4px 16px var(--shadow); overflow: hidden;
  }
  #scene-panel[hidden], #download-menu[hidden] { display: none; }
  textarea {
    width: 100%; height: 240px; padding: 8px; border: 0;
    font: inherit; resize: vertical; white-space: pre; color: inherit;
    background: var(--chrome); color-scheme: light dark;
  }
  .row { display: flex; gap: 4px; padding: 7px; border-top: 1px solid var(--rule); }
  .row button, #download-menu button { border-color: var(--rule); }

  /* The download menu hangs above its button, placed by the same code that places
     the tooltip, so it too escapes the scrolling bar. */
  #download-menu {
    position: fixed; z-index: 4; display: flex; flex-direction: column; gap: 2px;
    padding: 4px; background: var(--surface); border: 1px solid var(--rule);
    border-radius: 8px; box-shadow: 0 4px 16px var(--shadow);
  }
  #download-menu button { width: 100%; justify-content: flex-start; border-color: transparent; }
  #download-menu button:hover { background: var(--chrome); }

  /* --- documents and search ------------------------------------------------
     Neither belongs to minicanvas: a canvas primitive has no opinion about how
     many of them a page keeps or how you find one. Both live in the top corners
     and both leave with the toolbar, since ⌘. means all of the chrome. */
  .top-chrome {
    position: fixed; top: 12px; z-index: 3;
    background: var(--surface); border-color: var(--rule);
    transition: opacity .15s ease, transform .15s ease;
  }
  .top-chrome.away { opacity: 0; transform: translateY(-8px); pointer-events: none; }
  #doc-button { left: 12px; max-width: min(480px, 67.5vw); justify-content: flex-start; }
  #doc-button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #search-button { right: 12px; }

  #doc-panel, #search-panel {
    position: fixed; top: 12px; z-index: 4; padding: 6px;
    background: var(--surface); border: 1px solid var(--rule); border-radius: 10px;
    box-shadow: 0 6px 24px var(--shadow);
  }
  #doc-panel { left: 12px; width: min(390px, calc(100vw - 24px)); }
  #search-panel { right: 12px; width: min(560px, calc(100vw - 24px)); }
  #doc-panel[hidden], #search-panel[hidden] { display: none; }

  .field {
    width: 100%; height: 30px; padding: 0 8px; font: inherit; color: inherit;
    background: var(--chrome); border: 1px solid transparent; border-radius: 7px;
  }
  .field:focus { outline: none; border-color: var(--rule); }

  /* A list of places to go, not a stack of fields: no boxes, a little air between
     the rows, and the only thing drawn on a row is the one under the pointer. */
  .list {
    display: flex; flex-direction: column; gap: 3px; margin-top: 6px;
    max-height: min(52vh, 380px); overflow-y: auto;
  }
  .list:empty { display: none; }
  /* Two classes deep on purpose: the square-icon-button rule is `button:has(> .icon)`,
     which outweighs a single class and would pin these rows to 30 pixels wide.
     `.doc-row` rather than `.row` for the same reason in reverse: the scene panel
     already owns `.row`, and its top border turned every document into a box. */
  .list .pick {
    display: flex; flex-direction: column; align-items: stretch; gap: 1px;
    width: 100%; height: auto; min-height: 30px; padding: 6px 8px;
    text-align: left; justify-content: center; border-radius: 7px;
  }
  .list .pick[aria-selected="true"], .list .pick:hover { background: var(--chrome); }
  .list .pick[aria-current="true"] { font-weight: 600; }
  .list .pick .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Which document a result came from, under the line it matched rather than
     beside it: a snippet wants the whole width. */
  .list .pick .where {
    font-size: 11px; opacity: .55;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .list .pick mark { background: var(--selection-tint); color: inherit; border-radius: 2px; }
  .list .pick.new { opacity: .55; }

  /* A row carries controls of its own, so the row is a div and the name inside it
     is the button: a button inside a button is not a thing. Rename and delete hang
     over the end of the name rather than taking a column of their own, so a row
     that is not being pointed at is all name. */
  .list .doc-row { position: relative; display: flex; align-items: center; }
  .list .doc-row .pick { flex: 1 1 auto; min-width: 0; }
  .list .doc-row .sides {
    position: absolute; right: 3px; top: 50%; transform: translateY(-50%);
    display: flex; gap: 2px; opacity: 0; pointer-events: none;
  }
  .list .doc-row:hover .sides, .list .doc-row:focus-within .sides { opacity: 1; pointer-events: auto; }
  /* They only ever appear over a row that is being pointed at, so they take that
     row's colour rather than the panel's: a white square over a grey row reads as
     a hole in it. */
  .list .side { width: 24px; min-width: 24px; height: 24px; padding: 0; background: var(--chrome); }
  .list .side:hover, .list .side:focus-visible { background: var(--rule); }
  .list .side .icon { width: 16px; height: 16px; }
  /* Naming something: the field takes the row and the check mark sits on the end,
     out in the open rather than on hover, because it is the way out of the state. */
  .list .doc-row.editing { gap: 4px; }
  .list .doc-row .field { flex: 1 1 auto; min-width: 0; border-color: var(--rule); }
  .list .doc-row.editing .side { opacity: 1; pointer-events: auto; background: var(--chrome); }
  .empty { padding: 6px 8px; opacity: .55; }
  /* --- the board ------------------------------------------------------------
     Three layers. The scene layer carries the view as one transform, so panning
     and zooming move every item at once without touching any of them. The overlay
     never scales: a nine-pixel handle is nine pixels at every zoom, which is
     exactly what scaling it would ruin. */
  .mc-host { position: relative; overflow: hidden; touch-action: none; }
  .mc-layer {
    position: absolute; inset: 0;
    transform-origin: 0 0;
    /* Items answer the pointer only when there is something to point at them
       with. Every other tool is drawing on top of the work, and an element that
       took the press would steal the one that starts a stroke. */
    pointer-events: none;
  }
  /* While the camera moves, hint the compositor to keep the scene on its own
     layer so pan and zoom are one texture move, not a walk of every item. */
  .mc-host.mc-camera-moving .mc-layer { will-change: transform; }
  .mc-host.mc-picking .mc-layer { pointer-events: auto; }
  .mc-overlay { position: absolute; inset: 0; pointer-events: none; }
  /* The ruler measures text off-screen at scale 1, so a box knows its size before
     it has an element and keeps knowing it while the view is zoomed. */
  .mc-ruler {
    position: absolute; visibility: hidden; white-space: pre;
    top: -9999px; left: -9999px; pointer-events: none;
  }

  .mc-item { position: absolute; overflow: visible; }
  /* An <svg> is a replaced element, and its box answers the pointer like an image
     would — which would make the hollow middle of an outlined shape catchable
     after all. The box is turned off and the shapes inside turn themselves back
     on, so what answers is the ink and the band under it, and nothing else. */
  .mc-layer svg.mc-item { display: block; pointer-events: none; }
  /* The ink is what you see; the grab band under it is what you hit. A hairline is
     nearly impossible to point at, and the canvas build spent the same forgiveness
     in arithmetic rather than in a second path.

     Paint is set on the shapes themselves, never here. A CSS rule outranks a
     presentation attribute, so a `fill` in this block would quietly beat the one
     the renderer just wrote and every filled shape would come out hollow. What is
     left here is only what is true of all of them. */
  .mc-item .mc-ink {
    stroke-linecap: round; stroke-linejoin: round; pointer-events: none;
  }
  .mc-item .mc-grab {
    stroke: transparent; stroke-linecap: round; stroke-linejoin: round;
  }

  .mc-text {
    white-space: pre; margin: 0; cursor: default;
    /* Text on the board is real DOM, so the browser will happily select it on a
       drag unless told not to. Off by default; the open editor turns it back on. */
    user-select: none;
    /* The item's own box is the text's box: no padding, no border, nothing that
       would put the glyphs anywhere but where the format says they are. */
  }
  /* While open, the element is a field: caret placement, word selection, and
     drag-to-highlight are all native and need user-select back. */
  .mc-text.mc-editing { outline: none; cursor: text; pointer-events: auto; user-select: text; }
  /* Pointer capture keeps events on the board, but selection is document-wide: a
     drag that crosses the toolbar or another text item still sweeps them in. This
     class is on for the whole press and pairs with user-select: none here; the
     open editor above keeps its own user-select: text and is unaffected. */
  body.mc-dragging { user-select: none; }
  .mc-image { display: block; width: 100%; height: 100%; }

  /* --- the overlay ---------------------------------------------------------- */
  .mc-frame, .mc-marquee, .mc-handle, .mc-knob, .mc-stalk {
    position: absolute; box-sizing: border-box; pointer-events: none;
  }
  .mc-frame { border: 1.5px solid var(--selection); }
  .mc-frame.mc-hovered { opacity: .6; }
  .mc-marquee { border: 1.5px solid var(--marquee); background: var(--marquee-fill); }
  .mc-handle, .mc-knob {
    width: 9px; height: 9px; margin-left: -4.5px; margin-top: -4.5px;
    background: var(--handle-fill); border: 1.5px solid var(--selection);
  }
  .mc-knob { border-radius: 50%; }
  /* The stalk hangs from the knob down to the box top and turns about its top
     centre, matching the knob's own anchor point. */
  .mc-stalk {
    width: 1.5px; margin-left: -0.75px;
    background: var(--selection);
    transform-origin: 50% 0;
  }
</style>

<script>
/* minidom core — a div, a scene, and the seams to hang everything else on.
   Load this first, then whichever plugins you want, in the order listed in the
   spec. Every file is plain top-level code: concatenate them, or use one script
   tag each. No build step either way.

   The core alone gives you a scene that renders and a view you can pan and zoom.
   It knows the file format and nothing about tools.

   The difference from the canvas build is where the pixels live. Every item is an
   element inside a scaled layer, so the browser does the compositing, the hit
   testing, and the text editing that the canvas build had to do by hand. The file
   format, the plugin seams, and the public API are unchanged: the same scene JSON
   opens in either one. */
const miniCanvasPlugins = [];   // held here, not looked up through the function
const miniCanvasRegistry = [];  // { name, needs, setup }, in load order
const instances = [];
let active = null;

function createMiniCanvas(hostElement, options) {
  const settings = options || {};

  // Three layers, and only the middle one moves. The scene layer carries the view
  // as a CSS transform, so panning and zooming are one style write rather than a
  // redraw, and every item inside it can be positioned in world units and forget
  // the view exists. The overlay is screen-space and never scales: a handle is
  // nine pixels at every zoom, which is exactly what a transform would ruin.
  hostElement.classList.add('mc-host');
  const layer = document.createElement('div');
  layer.className = 'mc-layer';
  const overlay = document.createElement('div');
  overlay.className = 'mc-overlay';
  // Measured off-screen at scale 1, so a text box knows its size before it has an
  // element on the page — and keeps knowing it while the view is zoomed.
  const ruler = document.createElement('div');
  ruler.className = 'mc-ruler';
  hostElement.appendChild(layer);
  hostElement.appendChild(overlay);
  hostElement.appendChild(ruler);

  const core = {
    host: hostElement,
    canvas: hostElement,   // what events are dispatched on, and what the page sizes
    layer: layer,
    overlay: overlay,
    ruler: ruler,
    scene: { format: 'minicanvas/1', view: { x: 0, y: 0, scale: 1 }, items: [] },
    tool: 'pan',
    types: {},        // item type -> { dom, update, box, hit, move, svg }
    toolKeys: {},     // letter -> tool name, filled in by whichever tools are loaded
    api: {},          // what the caller gets back; plugins add their own methods
    hooks: {}
  };

  core.strokeColor = '#17171a';   // what new items are made with; the pens plugin
  core.strokeWidth = 3;           // adds the controls for changing them
  core.strokeOpacity = 1;
  core.fillOn = false;

  // How hard a scroll or a pinch bites. Zoom is multiplicative, so this is an
  // exponent: 4 means a given gesture covers four times the zoom range 1 did. Both
  // gestures read it at the moment of use, so a page can retune it live.
  core.zoomRate = 4;

  // Stamp the current pen onto a new item. Absent fields mean the default, so a
  // plain opaque unfilled shape writes nothing extra into the file.
  core.applyPen = (item) => {
    if (core.strokeOpacity < 1) item.opacity = core.strokeOpacity;
    return item;
  };

  // Every window-level listener is recorded so destroy() can take them all back off
  // again: a board in a single-page app should not outlive its element.
  const cleanups = [];
  core.listen = (target, type, handler, options) => {
    target.addEventListener(type, handler, options);
    cleanups.push(() => target.removeEventListener(type, handler, options));
  };

  // With several boards on a page, keys belong to the one you last pointed at.
  // With one, that question never comes up.
  instances.push(core);
  core.isActive = () => instances.length === 1 || active === core;

  const HANDLE_SIZE = core.HANDLE_SIZE = 9;   // screen pixels, constant at every zoom
  const GRAB_SLOP = core.GRAB_SLOP = 8;       // screen pixels of forgiveness when selecting

  // --- hooks ----------------------------------------------------------------
  // Handlers run in `order`, low first, and the first one to return true ends the
  // round. The numbers below are the whole contract between plugins: keep them in
  // one place so a new plugin can see where it lands without reading the others.
  //
  //   10  text caret placement      40  erase
  //   20  text commit on any click  50  select
  //   30  pan (space, pan tool)     90  tools that create things
  core.on = (name, handler, order) => {
    const list = core.hooks[name] || (core.hooks[name] = []);
    list.push({ handler: handler, order: order || 50 });
    list.sort((a, b) => a.order - b.order);
  };

  core.fire = (name, event, extra) => {
    for (const entry of core.hooks[name] || []) {
      if (entry.handler(event, extra)) return true;
    }
    return false;
  };

  core.emit = (name, detail) => {
    core.host.dispatchEvent(new CustomEvent(name, { detail: detail }));
  };

  // History is a plugin. Without it, recording does nothing and every caller still
  // reads the same: record a step, or take it back if the edit was a no-op. Either
  // way this is the one place every recorded edit passes through, so it is where
  // the change signal comes from.
  core.record = () => {};
  core.forget = () => {};
  let edits = 0;
  core.remember = () => { edits++; core.record(); };
  core.changed = () => { edits++; };

  const round = core.round = (value) => Math.round(value * 10) / 10;

  // --- colour ---------------------------------------------------------------
  // The canvas build had to ask the page what a variable resolved to, because CSS
  // cannot reach pixels drawn on a canvas. Elements are not pixels: a pen colour
  // is written as the variable itself and the browser resolves it, so switching
  // themes repaints the scene with no redraw and no cache to invalidate.
  const PENS = core.PENS = {
    '#17171a': '--pen-ink',   '#c0392b': '--pen-red',    '#d98c1f': '--pen-amber',
    '#2e8b57': '--pen-green', '#1f6feb': '--pen-blue',   '#6b4de6': '--pen-violet'
  };
  core.exporting = false;   // exports carry the document's own colours

  core.cssColor = (name, fallback) => {
    try {
      const found = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      if (found) return found;
    } catch (error) { /* no stylesheet in reach: the fallback is already right */ }
    return fallback;
  };

  core.themed = (color) => {
    const name = PENS[String(color).toLowerCase()];
    return (core.exporting || !name) ? color : 'var(' + name + ', ' + color + ')';
  };

  // --- geometry -------------------------------------------------------------
  core.screenPointOf = (event) => {
    const bounds = core.host.getBoundingClientRect();
    return { x: event.clientX - bounds.left, y: event.clientY - bounds.top };
  };

  const toWorld = core.toWorld = (screenPoint) => {
    const view = core.scene.view;
    return { x: screenPoint.x / view.scale + view.x, y: screenPoint.y / view.scale + view.y };
  };

  // The other direction, which the overlay needs on every frame: a frame drawn in
  // screen space has to know where a world box landed.
  const toScreen = core.toScreen = (world) => {
    const view = core.scene.view;
    return { x: (world.x - view.x) * view.scale, y: (world.y - view.y) * view.scale };
  };

  const viewCenter = core.viewCenter = () =>
    toWorld({ x: core.host.clientWidth / 2, y: core.host.clientHeight / 2 });

  core.zoomAround = (screenPoint, factor) => {
    const view = core.scene.view;
    const before = toWorld(screenPoint);
    view.scale = Math.min(40, Math.max(0.05, view.scale * factor));
    const after = toWorld(screenPoint);
    view.x += before.x - after.x;
    view.y += before.y - after.y;
  };

  const radiansOf = core.radiansOf = (degrees) => (degrees || 0) * Math.PI / 180;

  const spin = core.spin = (x, y, center, radians) => {
    const cos = Math.cos(radians), sin = Math.sin(radians);
    const dx = x - center.x, dy = y - center.y;
    return [center.x + dx * cos - dy * sin, center.y + dx * sin + dy * cos];
  };

  core.spinPoint = (point, center, degrees) => {
    const spun = spin(point.x, point.y, center, radiansOf(degrees));
    return { x: spun[0], y: spun[1] };
  };

  core.distanceToSegment = (px, py, x1, y1, x2, y2) => {
    const dx = x2 - x1, dy = y2 - y1;
    const lengthSquared = dx * dx + dy * dy;
    const t = lengthSquared
      ? Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / lengthSquared))
      : 0;
    return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
  };

  // The upright box an item fills, before its own rotation. A type says how to
  // measure itself; anything carrying x/y/w/h needs no help.
  const itemBox = core.itemBox = (item) => {
    const type = core.types[item.type];
    if (type && type.box) return type.box(item);
    return typeof item.w === 'number' ? { x: item.x, y: item.y, w: item.w, h: item.h } : null;
  };

  const itemCenter = core.itemCenter = (item) => {
    const box = itemBox(item) || boundsOf([item]);
    return box ? { x: box.x + box.w / 2, y: box.y + box.h / 2 } : { x: 0, y: 0 };
  };

  // A world point in an item's own upright frame, undoing its rotation. Rotation
  // lives in the core because it lives in the format: a file with angles renders
  // and hit-tests correctly whether or not the rotate plugin is loaded.
  const toLocal = core.toLocal = (item, world) => {
    if (!item.angle) return world;
    const spun = spin(world.x, world.y, itemCenter(item), -radiansOf(item.angle));
    return { x: spun[0], y: spun[1] };
  };

  const transformItem = core.transformItem = (item, transform) => {
    const type = core.types[item.type];
    if (type && type.move) { type.move(item, transform); return; }
    if (typeof item.x === 'number') {
      const moved = transform(item.x, item.y);
      item.x = moved[0];
      item.y = moved[1];
    }
  };

  // How far an item's ink spills past its geometry. A stroke's centreline is not
  // its edge: half the pen width sits outside on every side, which is why a box
  // drawn on the raw bounds cuts through the middle of a thick line. Here it is
  // also how much room the item's own element needs: an SVG clips at its edges.
  const inkPad = core.inkPad = (item) => {
    const type = core.types[item.type];
    return (type && type.ink) ? type.ink(item) : 0;
  };

  // What you can see, as opposed to where the coordinates are. Every item is grown
  // by its own ink before the boxes are merged, since they do not all spill alike.
  core.visualBounds = (items) => {
    let box = null;
    for (const item of items) {
      const own = boundsOf([item]);
      if (!own) continue;
      const pad = inkPad(item);
      const grown = { x: own.x - pad, y: own.y - pad, w: own.w + pad * 2, h: own.h + pad * 2 };
      if (!box) { box = grown; continue; }
      const right = Math.max(box.x + box.w, grown.x + grown.w);
      const bottom = Math.max(box.y + box.h, grown.y + grown.h);
      box.x = Math.min(box.x, grown.x);
      box.y = Math.min(box.y, grown.y);
      box.w = right - box.x;
      box.h = bottom - box.y;
    }
    return box;
  };

  const boundsOf = core.boundsOf = (items) => {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    const stretch = (x, y) => {
      minX = Math.min(minX, x); maxX = Math.max(maxX, x);
      minY = Math.min(minY, y); maxY = Math.max(maxY, y);
    };
    for (const item of items) {
      const type = core.types[item.type];
      if (type && type.bounds) { type.bounds(item, stretch); continue; }
      const box = itemBox(item);
      if (!box) continue;
      const right = box.x + box.w, bottom = box.y + box.h;
      if (!item.angle) { stretch(box.x, box.y); stretch(right, bottom); continue; }
      const middle = { x: box.x + box.w / 2, y: box.y + box.h / 2 };
      const radians = radiansOf(item.angle);   // a tilted item needs all four corners
      for (const corner of [[box.x, box.y], [right, box.y], [box.x, bottom], [right, bottom]]) {
        const spun = spin(corner[0], corner[1], middle, radians);
        stretch(spun[0], spun[1]);
      }
    }
    // The true size, including zero: a flat line is genuinely no units tall, and
    // rounding that up to 1 puts every box and every centre half a unit out.
    return minX === Infinity ? null : { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
  };

  // --- what is under the pointer --------------------------------------------
  // The canvas build answered this with a hit test per type. Here the browser has
  // already done it: every item is an element, and an unfilled shape is an SVG
  // shape with no fill, which the browser hit-tests on its stroke alone. That is
  // the same rule the canvas build spelled out in `nearEdge`, for free.
  //
  // `radius` is forgiveness in world units. Elements have no notion of it, so it
  // is spent twice: on a transparent grab band drawn under thin ink, and on a ring
  // of sample points here, which is what makes an empty shape's outline catchable
  // without making its middle catchable too.
  const elementItems = core.elementItems = new WeakMap();   // element -> item

  const itemAtPoint = (screenPoint) => {
    const bounds = core.host.getBoundingClientRect();
    const found = document.elementFromPoint(bounds.left + screenPoint.x, bounds.top + screenPoint.y);
    for (let node = found; node && node !== core.host; node = node.parentNode) {
      if (elementItems.has(node)) return elementItems.get(node);
    }
    return null;
  };

  core.itemAt = (world, radius) => {
    const middle = toScreen(world);
    const direct = itemAtPoint(middle);
    if (direct) return direct;
    const reach = (radius || 0) * core.scene.view.scale;
    if (reach < 1) return null;
    for (let step = 0; step < 8; step++) {   // a ring, not a disc: the middle missed
      const angle = step * Math.PI / 4;
      const found = itemAtPoint({ x: middle.x + Math.cos(angle) * reach,
                                  y: middle.y + Math.sin(angle) * reach });
      if (found) return found;
    }
    return null;
  };

  core.itemIndexAt = (world, radius) => {
    const item = core.itemAt(world, radius);
    return item ? core.scene.items.indexOf(item) : -1;
  };

  // --- rendering ------------------------------------------------------------
  // Not a redraw: a reconcile. Every item keeps its element between frames, so a
  // frame that changed one item leaves the other elements untouched and the
  // browser repaints what actually moved.
  let redrawQueued = false;
  let viewQueued = false;
  let announcedEdits = 0;
  const elements = new Map();   // item -> element
  let cameraMoving = false;
  let cameraEndTimer = null;

  function viewTransformOf(view) {
    return 'scale(' + view.scale + ') translate(' + (-view.x) + 'px, ' + (-view.y) + 'px)';
  }

  // One style write on the scene layer. Called synchronously on every camera
  // tick so pan and zoom never wait for the next frame.
  function applyViewTransform() {
    layer.style.transform = viewTransformOf(core.scene.view);
  }

  const beginCameraMove = core.beginCameraMove = () => {
    if (cameraMoving) return;
    cameraMoving = true;
    core.host.classList.add('mc-camera-moving');
  };

  const endCameraMove = core.endCameraMove = () => {
    if (!cameraMoving) return;
    cameraMoving = false;
    core.host.classList.remove('mc-camera-moving');
    if (cameraEndTimer) { clearTimeout(cameraEndTimer); cameraEndTimer = null; }
    core.fire('overlay');
    // Grab bands scale with zoom; a full reconcile picks that up once the
    // camera has settled rather than on every wheel or pinch tick.
    core.requestRedraw();
  };

  const scheduleCameraEnd = core.scheduleCameraEnd = () => {
    if (cameraEndTimer) clearTimeout(cameraEndTimer);
    cameraEndTimer = setTimeout(() => { cameraEndTimer = null; endCameraMove(); }, 150);
  };

  // Pan and zoom only move the layer transform; the item list is unchanged.
  // Overlay repositioning waits until the camera stops — with many shapes
  // selected, handles are the expensive part of a view tick, not the transform.
  function applyView() {
    applyViewTransform();
    if (!cameraMoving) core.fire('overlay');
  }

  core.requestViewUpdate = () => {
    applyViewTransform();
    if (cameraMoving || redrawQueued) return;
    if (viewQueued) return;
    viewQueued = true;
    requestAnimationFrame(() => { viewQueued = false; if (!cameraMoving) core.fire('overlay'); });
  };

  core.requestRedraw = () => {
    viewQueued = false;
    if (redrawQueued) return;
    redrawQueued = true;
    requestAnimationFrame(() => { redrawQueued = false; redraw(); });
  };

  // Where an item's element sits and how big it is. The element covers the item's
  // box grown by its ink, because an SVG clips at its own edges and half a pen
  // width lives outside the geometry.
  core.placeItem = (item, element) => {
    const box = itemBox(item) || boundsOf([item]);
    if (!box) return null;
    const pad = inkPad(item);
    const left = box.x - pad, top = box.y - pad;
    const width = box.w + pad * 2, height = box.h + pad * 2;
    element.style.left = left + 'px';
    element.style.top = top + 'px';
    element.style.width = width + 'px';
    element.style.height = height + 'px';
    element.style.opacity = item.opacity === undefined ? '' : item.opacity;
    // Rotation is a CSS transform about the item's own centre, which is the same
    // point the format rotates about, so the two agree without any arithmetic.
    element.style.transform = item.angle ? 'rotate(' + item.angle + 'deg)' : '';
    if (element.tagName === 'svg') {
      element.setAttribute('viewBox', left + ' ' + top + ' ' + width + ' ' + height);
    }
    return { x: left, y: top, w: width, h: height };
  };

  core.drawItem = (item) => {
    const type = core.types[item.type];
    if (!type || !type.dom) return null;   // a newer file still round-trips through here
    let element = elements.get(item);
    if (!element) {
      element = type.dom(item, core);
      element.classList.add('mc-item');
      elements.set(item, element);
      elementItems.set(element, item);
    }
    // On the page straight away, in whatever order, because something that has
    // just been made may need to be focused or measured before the next frame
    // reorders everything.
    if (element.parentNode !== layer) layer.appendChild(element);
    core.placeItem(item, element);
    type.update(item, element, core);
    return element;
  };

  // The element an item is drawn as, made if it does not exist yet. The text
  // editor needs one it can put a caret in the moment the item is created.
  core.elementOf = (item) => { core.drawItem(item); return elements.get(item) || null; };

  function redraw() {
    applyView();

    const live = new Set();
    core.scene.items.forEach((item, index) => {
      const element = core.drawItem(item);
      if (!element) return;
      live.add(element);
      // Document order is paint order, so the element list is the item list. Only
      // a move that is actually wrong touches the DOM.
      if (layer.children[index] !== element) {
        layer.insertBefore(element, layer.children[index] || null);
      }
    });
    for (const [item, element] of elements) {
      if (live.has(element)) continue;
      element.remove();
      elements.delete(item);
    }

    core.fire('afterdraw');
    if (edits !== announcedEdits) { announcedEdits = edits; core.emit('change', core.api); }
  }

  // --- tools ----------------------------------------------------------------
  core.spaceHeld = false;
  core.toolKeys.h = 'pan';   // the hand tool; always available, needs no plugin

  const applyCursor = core.applyCursor = () => {
    core.host.style.cursor = (core.tool === 'pan' || core.spaceHeld) ? 'grab'
      : core.tool === 'select' ? 'default'
      : 'crosshair';
  };

  // keepTyping switches tools without finishing text being typed.
  const setTool = core.setTool = (name, keepTyping) => {
    if (name === core.tool) return;
    core.fire('toolleave', name, keepTyping);
    core.tool = name;
    core.fire('toolenter', name);
    applyCursor();
    // Only the select tool wants the browser's own hit testing. Every other tool
    // is drawing on top of the work, and an element that answers the pointer would
    // steal the press that starts a stroke.
    core.host.classList.toggle('mc-picking', name === 'select');
    core.requestRedraw();
    // Whoever drew the toolbar owns its pressed states, so say the tool changed
    // rather than reaching out of the board to update buttons.
    core.emit('toolchange', name);
  };

  // --- pointer --------------------------------------------------------------
  const activePointers = new Map();
  let isPanning = false;
  let lastPinch = null;
  core.lastScreenPoint = null;
  core.hoverPoint = null;

  // The board's text is DOM, so dragging would otherwise highlight every label the
  // pointer crosses — canvas items and chrome alike. Three layers: CSS off by
  // default, a body class for the duration of a press, and blocking selectstart
  // and the default on pointerdown. The open editor opts out of all three.
  const syncSelectLock = () => {
    document.body.classList.toggle('mc-dragging', activePointers.size > 0);
  };

  core.host.addEventListener('selectstart', (event) => {
    if (!event.target.closest('.mc-editing')) event.preventDefault();
  });

  core.host.addEventListener('pointerdown', (event) => {
    active = core;   // whichever board you last touched owns the keyboard
    const screenPoint = core.screenPointOf(event);

    // The open editor owns the press: capture and body.mc-dragging would steal
    // pointer events and block native drag-to-highlight inside the field.
    if (event.target.closest('.mc-editing')) {
      core.fire('pointerdown', event, { screenPoint: screenPoint, world: toWorld(screenPoint) });
      return;
    }

    // Right click and ctrl/cmd-click are not selection gestures. Middle click
    // still reaches pan below.
    if (event.button !== 0 && event.button !== 1) return;
    if (event.button === 0 && (event.ctrlKey || event.metaKey)) return;

    // Capture on the host, not on the item that happened to be under the press:
    // capturing on an item takes its element out of the hit test for the rest of
    // the drag, which is the one moment the drag needs it there.
    core.host.setPointerCapture(event.pointerId);
    activePointers.set(event.pointerId, screenPoint);
    core.lastScreenPoint = screenPoint;
    syncSelectLock();   // body.mc-dragging — see syncSelectLock above
    event.preventDefault();   // stops the browser from starting a sweep on press

    if (activePointers.size === 2) {   // second finger down: pinch, not draw
      core.fire('cancel');
      lastPinch = null;
      core.requestRedraw();
      return;
    }
    core.fire('pointerdown', event, { screenPoint: screenPoint, world: toWorld(screenPoint) });
  });

  // Panning is core, so it is always available: hold space from any tool.
  core.on('pointerdown', (event) => {
    if (core.tool !== 'pan' && !core.spaceHeld && event.button !== 1) return false;
    isPanning = true;
    beginCameraMove();
    return true;
  }, 30);

  core.host.addEventListener('pointermove', (event) => {
    core.hoverPoint = core.screenPointOf(event);   // remembered even when nothing is pressed
    if (!activePointers.has(event.pointerId)) {
      // Nothing is pressed, so this is a hover. Plugins that care get told; the
      // pointer handlers below only run for an actual drag.
      core.fire('hover', event, { screenPoint: core.hoverPoint, world: toWorld(core.hoverPoint) });
      return;
    }
    const screenPoint = core.hoverPoint;
    activePointers.set(event.pointerId, screenPoint);

    if (activePointers.size >= 2) { beginCameraMove(); pinch(); core.lastScreenPoint = screenPoint; return; }

    if (isPanning) {
      core.scene.view.x -= (screenPoint.x - core.lastScreenPoint.x) / core.scene.view.scale;
      core.scene.view.y -= (screenPoint.y - core.lastScreenPoint.y) / core.scene.view.scale;
      core.requestViewUpdate();
    } else {
      core.fire('pointermove', event, {
        screenPoint: screenPoint,
        world: toWorld(screenPoint),
        from: toWorld(core.lastScreenPoint)
      });
    }
    core.lastScreenPoint = screenPoint;
  });

  function endPointer(event) {
    activePointers.delete(event.pointerId);
    syncSelectLock();   // release body.mc-dragging once every finger is up
    if (activePointers.size < 2) lastPinch = null;
    if (activePointers.size < 2 && cameraMoving && !isPanning) endCameraMove();
    if (activePointers.size === 0) {
      isPanning = false;
      core.fire('pointerup', event);
      if (cameraMoving) endCameraMove();
      else core.requestRedraw();
    }
  }
  // Direct, like the other host listeners: those live and die with the element,
  // and only window-level ones need taking back off in destroy().
  core.host.addEventListener('pointerleave', (event) => core.fire('hover', event, null));
  core.host.addEventListener('pointerup', endPointer);
  core.host.addEventListener('pointercancel', endPointer);

  function pinch() {
    const [a, b] = [...activePointers.values()];
    const distance = Math.hypot(a.x - b.x, a.y - b.y);
    const middle = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    if (lastPinch && lastPinch.distance > 0) {
      // Raising the finger-spread ratio to the same exponent keeps the two
      // gestures in step: pinching and scrolling reach a given zoom together.
      core.zoomAround(middle, Math.pow(distance / lastPinch.distance, core.zoomRate));
      core.scene.view.x -= (middle.x - lastPinch.middle.x) / core.scene.view.scale;
      core.scene.view.y -= (middle.y - lastPinch.middle.y) / core.scene.view.scale;
      core.requestViewUpdate();
    }
    lastPinch = { distance: distance, middle: middle };
  }

  core.host.addEventListener('wheel', (event) => {
    event.preventDefault();
    beginCameraMove();
    if (event.ctrlKey || event.metaKey) {          // trackpad pinch and ⌘-wheel
      core.zoomAround(core.screenPointOf(event), Math.exp(-event.deltaY / 200 * core.zoomRate));
    } else {
      core.scene.view.x += event.deltaX / core.scene.view.scale;
      core.scene.view.y += event.deltaY / core.scene.view.scale;
    }
    core.requestViewUpdate();
    scheduleCameraEnd();
  }, { passive: false });

  // --- keyboard -------------------------------------------------------------
  core.listen(window, 'keydown', (event) => {
    const tag = event.target && event.target.tagName;
    if (tag === 'TEXTAREA' || tag === 'INPUT') return;
    if (!core.isActive()) return;   // one keystroke, one board

    // Space pans from anywhere, including while a toolbar button holds focus.
    // Those buttons still answer to Enter, which is how they respond anyway.
    if (core.fire('typing', event)) return;
    if (event.code === 'Space') {
      core.spaceHeld = true;
      applyCursor();
      event.preventDefault();
      return;
    }
    if (!event.ctrlKey && !event.metaKey && !event.altKey) {
      const shortcut = core.toolKeys[(event.key || '').toLowerCase()];
      if (shortcut) { setTool(shortcut); event.preventDefault(); return; }
    }
    core.fire('keydown', event);
  });

  core.listen(window, 'keyup', (event) => {
    if (event.code === 'Space') { core.spaceHeld = false; applyCursor(); }
  });
  // Alt-tabbing away swallows the keyup, which would leave space stuck down.
  core.listen(window, 'blur', () => { core.spaceHeld = false; applyCursor(); });

  if (window.ResizeObserver) {
    const observer = new ResizeObserver(core.requestRedraw);
    observer.observe(core.host);
    cleanups.push(() => observer.disconnect());
  }
  core.listen(window, 'resize', core.requestRedraw);

  // --- scene in, scene out --------------------------------------------------
  core.fit = (padding) => {
    const box = boundsOf(core.scene.items);
    if (!box) return;
    const gap = padding == null ? 24 : padding;
    // A flat or upright box has no extent on one axis, so that axis sets no limit.
    const across = box.w ? (core.host.clientWidth - gap * 2) / box.w : Infinity;
    const down = box.h ? (core.host.clientHeight - gap * 2) / box.h : Infinity;
    const scale = Math.min(across, down);
    core.scene.view.scale = Math.min(40, Math.max(0.05, scale === Infinity ? 1 : scale));
    core.scene.view.x = box.x + box.w / 2 - core.host.clientWidth / 2 / core.scene.view.scale;
    core.scene.view.y = box.y + box.h / 2 - core.host.clientHeight / 2 / core.scene.view.scale;
    core.requestRedraw();
  };

  // Which plugin draws which type, for the warning below and nothing else. A type
  // that is missing is by definition not around to introduce itself.
  // These name the item files, not the tool files: drawing is what is missing.
  const DRAWN_BY = { stroke: 'item-stroke', rect: 'item-shapes', oval: 'item-shapes',
                     text: 'item-text', image: 'item-image' };

  // A scene full of items nothing can draw looks exactly like a broken page. Say so
  // once, at load, rather than leaving someone staring at an empty board.
  function warnAboutUnrenderable() {
    const missing = new Set();
    for (const item of core.scene.items) {
      const type = core.types[item.type];
      if (!type || !type.dom) missing.add(item.type);
    }
    if (!missing.size || typeof console === 'undefined') return;
    const plugins = [...missing].map((type) => DRAWN_BY[type]).filter(Boolean);
    console.warn('minicanvas: nothing loaded can draw ' + [...missing].join(', ')
      + '. The items are kept and will be written back out, but they will not appear.'
      + (plugins.length ? ' Add: ' + [...new Set(plugins)].map((p) => 'minicanvas-' + p + '.js').join(', ') : ''));
  }

  core.load = (data) => {
    const parsed = typeof data === 'string' ? JSON.parse(data) : data;
    core.scene = { format: 'minicanvas/1', view: { x: 0, y: 0, scale: 1 }, items: [], ...parsed };
    core.scene.view.scale = core.scene.view.scale || 1;
    edits = announcedEdits = 0;   // a fresh document has no unsaved edits
    cameraMoving = false;
    core.host.classList.remove('mc-camera-moving');
    // The old scene's elements belong to items nobody holds any more.
    for (const [, element] of elements) element.remove();
    elements.clear();
    core.fire('load');
    warnAboutUnrenderable();
    core.requestRedraw();
    return core.scene;
  };

  // Pretty JSON, but number arrays stay on one line so a stroke reads as a stroke.
  core.toText = () => JSON.stringify(core.scene, null, 2)
    .replace(/\[[\d.,\s-]*\]/g, (block) => '[' + block.slice(1, -1).trim().replace(/\s+/g, ' ') + ']');

  Object.assign(core.api, {
    // Listen for 'change' (an edit was recorded), 'toolchange', or 'selectionchange'.
    on: (type, handler) => { core.host.addEventListener(type, handler); return core.api; },
    off: (type, handler) => { core.host.removeEventListener(type, handler); return core.api; },
    destroy: () => {
      if (cameraEndTimer) clearTimeout(cameraEndTimer);
      cleanups.forEach((undo) => undo());
      cleanups.length = 0;
      layer.remove();
      overlay.remove();
      ruler.remove();
      const at = instances.indexOf(core);
      if (at >= 0) instances.splice(at, 1);
      if (active === core) active = null;
    },
    load: core.load,
    scene: () => core.scene,
    toText: core.toText,
    fit: core.fit,
    viewCenter: viewCenter,
    redraw: core.requestRedraw,
    tool: () => core.tool,
    setTool: setTool,
    core: core          // plugins are ordinary code; so is reaching past the API
  });

  // Closing over the list rather than reading createMiniCanvas.plugins means a
  // wrapper or a re-export of the factory still builds a working board.
  for (const plugin of settings.plugins || miniCanvasPlugins) plugin(core);

  applyCursor();
  core.requestRedraw();
  return core.api;
}

createMiniCanvas.plugins = miniCanvasPlugins;

/* ---------------------------------------------------------------------------
   The public API. Everything above is the machine; this is the handle.

     MiniCanvas.mount('#board', { scene: '#scene', features: 'viewer' })

   A plugin file registers itself by name, and says what it cannot work without.
   Asking for a feature always brings its dependencies, so nobody has to remember
   that transform needs select.
--------------------------------------------------------------------------- */
createMiniCanvas.plugin = function (name, needs, setup) {
  if (typeof needs === 'function') { setup = needs; needs = []; }
  miniCanvasRegistry.push({ name: name, needs: needs, setup: setup });
  miniCanvasPlugins.push(setup);
  return createMiniCanvas;
};

// Names are forgiving: 'text' finds item-text and tool-text, 'draw' finds
// tool-draw. Ask for what you mean, not for the filename.
function matchFeature(name) {
  const found = miniCanvasRegistry.filter((entry) =>
    entry.name === name || entry.name.endsWith('-' + name));
  if (!found.length) {
    throw new Error('minicanvas: no feature called "' + name + '". Loaded: '
      + miniCanvasRegistry.map((entry) => entry.name).join(', '));
  }
  return found;
}

function chooseFeatures(features) {
  if (features === undefined || features === null || features === 'all') return miniCanvasRegistry.slice();
  // A viewer is every renderer and no tool: it draws what it is given and makes
  // nothing. There is no read-only flag anywhere, because there is nothing to turn off.
  if (features === 'viewer') return miniCanvasRegistry.filter((entry) => entry.name.startsWith('item-'));

  if (Array.isArray(features)) {
    const wanted = [];
    const add = (entry) => {
      if (wanted.includes(entry)) return;
      entry.needs.forEach((need) => matchFeature(need).forEach(add));
      wanted.push(entry);
    };
    features.forEach((name) => matchFeature(name).forEach(add));
    return miniCanvasRegistry.filter((entry) => wanted.includes(entry));   // load order wins
  }

  if (features.without) {
    const dropped = new Set();
    features.without.forEach((name) => matchFeature(name).forEach((entry) => dropped.add(entry.name)));
    // Dropping something drops whatever leans on it, however far down that goes.
    let settled = false;
    while (!settled) {
      settled = true;
      for (const entry of miniCanvasRegistry) {
        if (dropped.has(entry.name)) continue;
        if (entry.needs.some((need) => matchFeature(need).every((dep) => dropped.has(dep.name)))) {
          dropped.add(entry.name);
          settled = false;
        }
      }
    }
    return miniCanvasRegistry.filter((entry) => !dropped.has(entry.name));
  }
  throw new Error('minicanvas: features must be "all", "viewer", an array, or { without: [...] }');
}

// A scene can be the data itself, JSON text, or a selector pointing at a
// <script type="application/json"> block on the page.
function readScene(scene) {
  if (typeof scene !== 'string') return scene;
  const text = scene.trim();
  if (text.startsWith('{')) return text;
  const node = document.querySelector(scene);
  if (!node) throw new Error('minicanvas: nothing matched the scene selector "' + scene + '"');
  return node.textContent;
}

createMiniCanvas.mount = function (target, options) {
  const settings = options || {};
  const element = typeof target === 'string' ? document.querySelector(target) : target;
  if (!element) throw new Error('minicanvas: nothing matched "' + target + '"');
  const board = createMiniCanvas(element, {
    plugins: chooseFeatures(settings.features).map((entry) => entry.setup)
  });
  if (settings.scene !== undefined) board.load(readScene(settings.scene));
  if (settings.tool) board.setTool(settings.tool);
  if (settings.fit) board.fit(typeof settings.fit === 'number' ? settings.fit : undefined);
  return board;
};

// What this page has loaded, which is also the list of names mount() will take.
Object.defineProperty(createMiniCanvas, 'features', {
  get: () => miniCanvasRegistry.map((entry) => entry.name)
});

if (typeof window !== 'undefined') window.MiniCanvas = createMiniCanvas;


/* pens — the current colour, width, opacity, and fill, and the keys that change
   them. Whatever is selected changes with the pen, so one key does both jobs.
   Needs: core. Better with: select (restyling what is picked).
   Split out because a read-only build needs none of it. */
createMiniCanvas.plugin('pens', [], function (core) {
  // The four fade steps, plus opaque so there is a way back to it.
  const OPACITIES = [1, 0.7, 0.5, 0.3, 0.1];
  const WIDTHS = [1, 3, 8];

  const selected = () => core.selection ? [...core.selection] : [];

  // One place for "change the pen, and change what is picked with it". Every edit
  // to a selection goes through here so the undo step and the redraw are not
  // forgotten in one of four handlers.
  function apply(change) {
    const items = selected();
    if (!items.length) return;
    let touched = false;
    core.remember();
    for (const item of items) if (change(item)) touched = true;
    if (!touched) core.forget(); else core.requestRedraw();
  }

  core.api.setStroke = (color, width) => {
    if (color) core.strokeColor = color;
    if (width) core.strokeWidth = width;
    apply((item) => {
      let changed = false;
      // An image has neither a colour nor a width, so nothing to restyle.
      if (color && 'color' in item) { item.color = color; changed = true; }
      if (color && item.fill) { item.fill = color; changed = true; }   // a filled shape stays one colour
      if (width && typeof item.width === 'number') { item.width = width; changed = true; }
      return changed;
    });
  };

  // Fill is a colour, not a flag: absent means unfilled, so a plain outline writes
  // nothing extra into the file.
  const toggleFill = core.api.toggleFill = () => {
    const shapes = selected().filter((item) => item.type === 'rect' || item.type === 'oval');
    const filling = shapes.length ? !shapes.some((item) => item.fill) : !core.fillOn;
    core.fillOn = filling;
    apply((item) => {
      if (item.type !== 'rect' && item.type !== 'oval') return false;
      if (filling) item.fill = item.color; else delete item.fill;
      return true;
    });
    core.emit('penchange', penState());
    return filling;
  };

  const cycleOpacity = core.api.cycleOpacity = () => {
    const at = OPACITIES.indexOf(core.strokeOpacity);
    core.strokeOpacity = OPACITIES[(at + 1) % OPACITIES.length];
    apply((item) => {
      // Full opacity is the default, so it is stored as nothing at all.
      if (core.strokeOpacity < 1) item.opacity = core.strokeOpacity;
      else delete item.opacity;
      return true;
    });
    core.emit('penchange', penState());
    return core.strokeOpacity;
  };

  const cycleWidth = core.api.cycleWidth = () => {
    const inked = selected().filter((item) => typeof item.width === 'number');
    // Follow what is selected when there is something, so the cycle starts from
    // the weight you are looking at rather than from the pen's own idea.
    const from = inked.length ? inked[0].width : core.strokeWidth;
    const next = WIDTHS[(WIDTHS.indexOf(from) + 1) % WIDTHS.length];
    core.api.setStroke(null, next);
    core.emit('penchange', penState());
    return next;
  };

  const cycleColor = core.api.cycleColor = () => {
    const pens = Object.keys(core.PENS);
    const items = selected();
    // Follow whatever is selected if anything is, so the cycle picks up where the
    // thing you are looking at already sits.
    const from = items.length && items[0].color ? items[0].color : core.strokeColor;
    const next = pens[(pens.indexOf(String(from).toLowerCase()) + 1) % pens.length];
    core.api.setStroke(next, null);
    core.emit('penchange', penState());
    return next;
  };

  function penState() {
    return { color: core.strokeColor, width: core.strokeWidth,
             opacity: core.strokeOpacity, fill: core.fillOn };
  }
  core.api.pen = penState;

  const KEYS = { f: toggleFill, g: cycleOpacity, c: cycleColor, w: cycleWidth };

  core.on('keydown', (event) => {
    if (event.ctrlKey || event.metaKey || event.altKey) return false;
    const action = KEYS[(event.key || '').toLowerCase()];
    if (!action) return false;
    action();
    event.preventDefault();
    return true;
  });
});


/* item: stroke — how a freehand stroke draws, measures, and exports. No tool: a
   read-only build renders every stroke in the file and makes none.
   Needs: core. */
createMiniCanvas.plugin('item-stroke', [], function (core) {
  const SVG_NS = 'http://www.w3.org/2000/svg';

  const pathOf = (stroke) => {
    const points = stroke.points;
    if (points.length < 2) return '';
    // A single tap is a 0.01-long line, not a special-cased dot: round caps turn
    // it into one, which is the same trick the canvas build used.
    if (points.length === 2) return 'M' + points[0] + ' ' + points[1] + 'l0.01 0';
    let d = 'M' + points[0] + ' ' + points[1];
    for (let i = 2; i < points.length; i += 2) d += 'L' + points[i] + ' ' + points[i + 1];
    return d;
  };

  core.types.stroke = {
    dom() {
      const svg = document.createElementNS(SVG_NS, 'svg');
      // The grab band goes under the ink and answers the pointer for it: a hairline
      // is nearly impossible to hit at the width it is drawn, and the canvas build
      // spent GRAB_SLOP on the same problem in arithmetic.
      svg.appendChild(document.createElementNS(SVG_NS, 'path')).setAttribute('class', 'mc-grab');
      svg.appendChild(document.createElementNS(SVG_NS, 'path')).setAttribute('class', 'mc-ink');
      return svg;
    },

    update(stroke, svg) {
      const [grab, ink] = svg.childNodes;
      const d = pathOf(stroke);
      const slop = core.GRAB_SLOP * 2 / core.scene.view.scale;
      grab.setAttribute('d', d);
      grab.setAttribute('fill', 'none');
      grab.setAttribute('pointer-events', 'stroke');
      grab.setAttribute('stroke-width', Math.max(stroke.width, slop));
      ink.setAttribute('d', d);
      ink.setAttribute('fill', 'none');   // a path fills by default, and ink is a line
      ink.setAttribute('stroke', core.themed(stroke.color));
      ink.setAttribute('stroke-width', stroke.width);
    },

    // Round caps and joins, so the ink reaches half the pen width in every direction.
    ink: (stroke) => stroke.width / 2,

    // A bag of points has no box of its own, and rotates by moving them.
    bounds(stroke, stretch) {
      for (let i = 0; i < stroke.points.length; i += 2) stretch(stroke.points[i], stroke.points[i + 1]);
    },

    move(stroke, transform) {
      for (let i = 0; i < stroke.points.length; i += 2) {
        const moved = transform(stroke.points[i], stroke.points[i + 1]);
        stroke.points[i] = moved[0];
        stroke.points[i + 1] = moved[1];
      }
    },

    // Strokes are box-selected by their points, not their bounding box, so a
    // marquee beside a long diagonal misses it.
    within(stroke, inside) {
      for (let i = 0; i < stroke.points.length; i += 2) {
        if (inside(stroke.points[i], stroke.points[i + 1])) return true;
      }
      return false;
    },

    svg(stroke, escape) {
      const pairs = [];
      for (let i = 0; i < stroke.points.length; i += 2) pairs.push(stroke.points[i] + ',' + stroke.points[i + 1]);
      return `<polyline points="${pairs.join(' ')}" fill="none" stroke="${escape(stroke.color)}"`
           + ` stroke-width="${stroke.width}" stroke-linecap="round" stroke-linejoin="round"/>`;
    }
  };
});

/* item: shapes — how rectangles and ovals draw, hit, and export. No tools.
   Needs: core. */
createMiniCanvas.plugin('item-shapes', [], function (core) {
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const CORNER_RADIUS = 6;   // world units, a renderer choice and not stored
  // Corners stay gentle, and shrink out of the way on small rectangles.
  const cornerRadiusOf = (shape) => Math.max(0, Math.min(CORNER_RADIUS, shape.w / 4, shape.h / 4));

  // An unfilled shape answers only to its outline, so a big rectangle drawn around
  // other work does not swallow every click inside it. The canvas build worked
  // that out in `nearEdge`; an SVG shape with no fill is hit-tested on its stroke
  // alone, so here it is what the browser already does.
  const shapeType = {
    dom(shape) {
      const svg = document.createElementNS(SVG_NS, 'svg');
      const tag = shape.type === 'rect' ? 'rect' : 'ellipse';
      svg.appendChild(document.createElementNS(SVG_NS, tag)).setAttribute('class', 'mc-grab');
      svg.appendChild(document.createElementNS(SVG_NS, tag)).setAttribute('class', 'mc-ink');
      return svg;
    },

    update(shape, svg) {
      const [grab, ink] = svg.childNodes;
      const slop = core.GRAB_SLOP * 2 / core.scene.view.scale;
      for (const node of [grab, ink]) {
        if (shape.type === 'rect') {
          node.setAttribute('x', shape.x);
          node.setAttribute('y', shape.y);
          node.setAttribute('width', Math.max(0, shape.w));
          node.setAttribute('height', Math.max(0, shape.h));
          node.setAttribute('rx', cornerRadiusOf(shape));
        } else {
          node.setAttribute('cx', shape.x + shape.w / 2);
          node.setAttribute('cy', shape.y + shape.h / 2);
          node.setAttribute('rx', Math.max(0, shape.w / 2));
          node.setAttribute('ry', Math.max(0, shape.h / 2));
        }
      }
      // Filled or outlined, never both. Drawing an outline over a fill of the same
      // colour doubles up along the edge, which shows as a darker rim as soon as
      // the item is anything less than opaque.
      grab.setAttribute('stroke-width', Math.max(shape.width, slop));
      // A filled shape is solid throughout, so the band under it is filled too —
      // invisibly — and that fill is what makes its middle answer the pointer.
      // An unfilled one has no middle to answer with, which is the whole rule.
      grab.setAttribute('fill', shape.fill ? 'transparent' : 'none');
      grab.setAttribute('pointer-events', shape.fill ? 'all' : 'stroke');
      ink.setAttribute('fill', shape.fill ? core.themed(shape.fill) : 'none');
      ink.setAttribute('stroke', shape.fill ? 'none' : core.themed(shape.color));
      ink.setAttribute('stroke-width', shape.fill ? 0 : shape.width);
    },

    // A filled shape has no stroke, so nothing spills past its box. An outlined one
    // carries half its pen width outside the path, same as a line.
    ink: (shape) => shape.fill ? 0 : shape.width / 2,

    scale(shape, scaleX, scaleY) { shape.w *= scaleX; shape.h *= scaleY; },

    // A filled shape is solid throughout its box, so any overlap with the marquee
    // is a touch, same as a click. An unfilled one is a ring: reaching into its
    // hollow middle without ever crossing the line is not a touch.
    within(shape, inside, marquee) {
      const box = core.boundsOf([shape]);
      if (!box) return false;
      const touches = box.x <= marquee.x + marquee.w && box.x + box.w >= marquee.x
                    && box.y <= marquee.y + marquee.h && box.y + box.h >= marquee.y;
      if (!touches || shape.fill) return touches;
      const pad = core.inkPad(shape);
      const holeRight = box.x + box.w - pad, holeBottom = box.y + box.h - pad;
      const inHole = marquee.x >= box.x + pad && marquee.x + marquee.w <= holeRight
                   && marquee.y >= box.y + pad && marquee.y + marquee.h <= holeBottom;
      return !inHole;
    },

    svg(shape, escape) {
      // Same rule as the renderer: a filled shape carries no stroke at all.
      const paint = shape.fill
        ? `fill="${escape(shape.fill)}" stroke="none"`
        : `fill="none" stroke="${escape(shape.color)}" stroke-width="${shape.width}"`;
      if (shape.type === 'rect') {
        return `<rect x="${shape.x}" y="${shape.y}" width="${shape.w}" height="${shape.h}"`
             + ` rx="${cornerRadiusOf(shape)}" ${paint}`;
      }
      return `<ellipse cx="${shape.x + shape.w / 2}" cy="${shape.y + shape.h / 2}"`
           + ` rx="${shape.w / 2}" ry="${shape.h / 2}" ${paint}`;
    }
  };
  core.types.rect = shapeType;
  core.types.oval = shapeType;
});

/* item: text — how a text item draws, measures, and exports. Multiple lines, no
   editor: this is what a read-only build needs.
   Needs: core. */
createMiniCanvas.plugin('item-text', [], function (core) {
  const TEXT_SIZE = core.TEXT_SIZE = 24;   // world units, the size new text starts at
  const FONT = core.TEXT_FONT = 'sans-serif';   // a family every renderer will still have
  const LINE_SPACING = 1.25;   // a renderer choice, like the corner radius: not stored

  const fontOf = core.fontOf = (item) => (item.size || TEXT_SIZE) + 'px ' + FONT;
  const lineHeight = core.lineHeight = (item) => (item.size || TEXT_SIZE) * LINE_SPACING;
  const linesOf = core.textLines = (item) => String(item.text || '').split('\n');

  // Width of a piece of one line. The editor needs this to place a caret, and the
  // box needs it to know how wide the widest line runs.
  //
  // The canvas build asked a 2D context to measure. Here the thing that lays the
  // text out is the thing that measures it: one off-screen element, at scale 1, in
  // the same font the item is drawn in. Measuring the item's own element instead
  // would be wrong the moment the view is zoomed.
  const measureLine = core.measureLine = (item, text) => {
    const ruler = core.ruler;
    ruler.style.font = fontOf(item);
    ruler.textContent = text;
    return ruler.getBoundingClientRect().width;
  };

  // Where an index into the whole string lands: which line, and how far along it.
  core.caretSpot = (item, index) => {
    const before = String(item.text || '').slice(0, index);
    const row = (before.match(/\n/g) || []).length;
    const column = before.length - (before.lastIndexOf('\n') + 1);
    const line = linesOf(item)[row] || '';
    return { row: row, column: column, x: measureLine(item, line.slice(0, column)),
             y: row * lineHeight(item) };
  };

  // The index where a given row and column falls, clamped to what exists.
  core.caretIndex = (item, row, column) => {
    const lines = linesOf(item);
    const atRow = Math.max(0, Math.min(lines.length - 1, row));
    let index = 0;
    for (let i = 0; i < atRow; i++) index += lines[i].length + 1;
    return index + Math.max(0, Math.min(lines[atRow].length, column));
  };

  core.types.text = {
    box(item) {
      const lines = linesOf(item);
      let width = 0;
      for (const line of lines) width = Math.max(width, measureLine(item, line));
      return { x: item.x, y: item.y, w: width, h: lines.length * lineHeight(item) };
    },

    dom() {
      const element = document.createElement('div');
      element.className = 'mc-text';
      return element;
    },

    update(item, element) {
      element.style.font = fontOf(item);
      element.style.lineHeight = lineHeight(item) + 'px';
      element.style.color = core.themed(item.color);
      // While the editor holds it, the element is the document: writing to it would
      // move the caret out from under whoever is typing.
      if (element.isContentEditable) return;
      if (element.textContent !== String(item.text || '')) {
        element.textContent = String(item.text || '');
      }
    },

    scale(item, scaleX, scaleY) { item.size *= (scaleX + scaleY) / 2; },

    svg(item, escape) {
      const size = item.size || TEXT_SIZE;
      // The renderer draws text from its top, SVG from its baseline. 0.8 of the
      // size is the usual gap between the two, and it keeps the export
      // dependency-free.
      return `<text x="${item.x}" y="${core.round(item.y + size * 0.8)}" font-family="${FONT}"`
           + ` font-size="${size}" fill="${escape(item.color)}"`;
    },
    // One tspan per line, each pushed down by a whole line from the one before.
    svgBody: (item, escape) => linesOf(item).map((line, row) =>
      `<tspan x="${item.x}" dy="${row ? core.round(lineHeight(item)) : 0}">${escape(line)}</tspan>`).join(''),
    svgTag: 'text'
  };

  // Building a text item is not editing it: the clipboard uses this to turn pasted
  // prose into something the scene can hold.
  core.newText = (world, text) => {
    const item = core.applyPen({ type: 'text', color: core.strokeColor, size: TEXT_SIZE,
                                 x: 0, y: 0, text: text });
    const box = core.types.text.box(item);
    item.x = core.round(world.x - box.w / 2);
    item.y = core.round(world.y - box.h / 2);
    return item;
  };
});

/* item: image — how an image draws and hits. No inserting: that is editing.
   Needs: core. */
createMiniCanvas.plugin('item-image', [], function (core) {
  core.imageCache = new Map();   // src -> Image, for whoever measures before placing

  core.types.image = {
    dom() {
      const element = document.createElement('img');
      element.className = 'mc-image';
      element.draggable = false;   // the browser's own drag would fight the board's
      return element;
    },
    update(item, element) {
      if (element.getAttribute('src') !== item.src) element.setAttribute('src', item.src);
    },
    scale(item, scaleX, scaleY) { item.w *= scaleX; item.h *= scaleY; },
    svg: (item, escape) =>
      `<image x="${item.x}" y="${item.y}" width="${item.w}" height="${item.h}" href="${escape(item.src)}"`
  };
});

/* tool: draw — the pen that makes strokes.
   Needs: core, item-stroke. */
createMiniCanvas.plugin('tool-draw', ['item-stroke'], function (core) {
  let currentStroke = null;

  core.toolKeys.d = 'draw';
  core.on('pointerdown', (event, at) => {
    if (core.tool !== 'draw') return false;
    core.remember();
    currentStroke = core.applyPen({
      type: 'stroke',
      color: core.strokeColor,
      width: core.strokeWidth,
      points: [core.round(at.world.x), core.round(at.world.y)]
    });
    core.scene.items.push(currentStroke);
    core.requestRedraw();
    return true;
  }, 90);

  core.on('pointermove', (event, at) => {
    if (!currentStroke) return false;
    const points = currentStroke.points;
    const moved = Math.hypot(at.world.x - points[points.length - 2], at.world.y - points[points.length - 1]);
    // Sampled in screen space, so detail stays the same at any zoom.
    if (moved * core.scene.view.scale > 1.5) {
      points.push(core.round(at.world.x), core.round(at.world.y));
      core.requestRedraw();
    }
    return true;
  }, 90);

  core.on('pointerup', () => { currentStroke = null; return false; });
  core.on('cancel', () => {
    if (currentStroke && currentStroke.points.length <= 4) core.scene.items.pop();
    currentStroke = null;
    return false;
  });
});


/* tool: shapes — dragging out a rectangle or an oval.
   Needs: core, item-shapes. */
createMiniCanvas.plugin('tool-shapes', ['item-shapes'], function (core) {
  let currentShape = null;
  let shapeOrigin = null;

  core.toolKeys.r = 'rect';
  core.toolKeys.o = 'oval';
  // Shapes are stored corner-first with positive size, whichever way you drag.
  // Shift squares them off the longer edge, so the corner you are holding wins.
  function sizeShape(world, square) {
    let dx = world.x - shapeOrigin.x;
    let dy = world.y - shapeOrigin.y;
    if (square) {
      const size = Math.max(Math.abs(dx), Math.abs(dy));
      dx = dx < 0 ? -size : size;
      dy = dy < 0 ? -size : size;
    }
    currentShape.x = core.round(Math.min(shapeOrigin.x, shapeOrigin.x + dx));
    currentShape.y = core.round(Math.min(shapeOrigin.y, shapeOrigin.y + dy));
    currentShape.w = core.round(Math.abs(dx));
    currentShape.h = core.round(Math.abs(dy));
    core.requestRedraw();
  }

  core.on('pointerdown', (event, at) => {
    if (core.tool !== 'rect' && core.tool !== 'oval') return false;
    core.remember();
    shapeOrigin = at.world;
    currentShape = core.applyPen({ type: core.tool, color: core.strokeColor,
                                   width: core.strokeWidth, x: core.round(at.world.x),
                                   y: core.round(at.world.y), w: 0, h: 0 });
    if (core.fillOn) currentShape.fill = core.strokeColor;
    core.scene.items.push(currentShape);
    core.requestRedraw();
    return true;
  }, 90);

  core.on('pointermove', (event, at) => {
    if (!currentShape) return false;
    sizeShape(at.world, event.shiftKey);
    return true;
  }, 90);

  core.on('pointerup', () => {
    if (!currentShape) return false;
    const made = currentShape;
    currentShape = null;
    // A click with no drag leaves nothing behind, and costs no undo step.
    if (!made.w && !made.h) { core.scene.items.pop(); core.forget(); }
    else if (core.selectItem) { core.setTool('select'); core.selectItem(made); }
    return false;
  });
  core.on('cancel', () => { currentShape = null; return false; });
  core.on('toolleave', () => { currentShape = null; return false; });
});


/* tool: text — the editor. In the canvas build this was the largest plugin by
   some way: a caret, its blink, selected runs drawn behind the glyphs, arrow keys,
   Home and End, word selection, drag selection, and a measurement pass behind all
   of it. Every one of those is something a browser already does to a text node, so
   here the editor is `contenteditable` and a commit path, and the rest is gone.
   What is left is the part that is actually about this program: when an item opens,
   where a new one grows from, and how the text gets back into the scene.
   Needs: core, item-text. Better with: select (double click to reopen). */
createMiniCanvas.plugin('tool-text', ['item-text'], function (core) {
  const TEXT_SIZE = core.TEXT_SIZE;

  let editing = null;        // the text item currently taking keystrokes
  let textOrigin = null;     // the click a new text item stays centred on
  let lastTap = null;        // for spotting a double click

  core.toolKeys.t = 'text';

  const elementOf = core.elementOf;

  // `plaintext-only` is the right mode and the one every browser here has had
  // longest except Firefox, which only took it recently. Setting it and then
  // asking whether it stuck costs one line and leaves the older answer working:
  // paste is filtered to plain text below either way, and the text is read back
  // with innerText, which flattens whatever markup a stray rich paste left.
  function makeEditable(element) {
    element.setAttribute('contenteditable', 'plaintext-only');
    if (!element.isContentEditable) element.setAttribute('contenteditable', 'true');
    element.classList.add('mc-editing');
    element.focus({ preventScroll: true });
  }

  // The element is the document while it is open, so this is the one place the
  // typing gets read back out. A contenteditable div reports line breaks as <br>
  // and, in some browsers, as nested divs; innerText resolves both to the newlines
  // the format stores.
  function readBack() {
    if (!editing) return;
    const element = elementOf(editing);
    if (!element) return;
    const text = element.innerText.replace(/\r\n?/g, '\n').replace(/\n$/, '');
    if (text === editing.text) return;
    editing.text = text;
    core.changed();
    recentreText();
  }

  // Text is committed by any click elsewhere, a tool change, or Escape. An empty
  // one leaves nothing behind, and gives back the undo step it took.
  function commitText() {
    if (!editing) return;
    const item = editing;
    readBack();
    const element = elementOf(item);
    editing = null;
    textOrigin = null;
    if (element) {
      element.removeAttribute('contenteditable');
      element.classList.remove('mc-editing');
      element.blur();
    }
    if (!item.text) {
      const index = core.scene.items.indexOf(item);
      if (index >= 0) core.scene.items.splice(index, 1);
      core.forget();
    }
    core.requestRedraw();
  }
  core.commitText = commitText;

  // Opening an item selects the whole string, the way double-clicking a field does
  // anywhere else: type to replace it, or press an arrow to drop the caret at that
  // end and keep what is there.
  function startEditing(item, atPoint) {
    commitText();
    editing = item;
    textOrigin = null;   // an existing item keeps its position and grows rightward
    // The double click that opened the editor is spent. Without this the next
    // press would read as the second half of it and take a word when it meant to
    // put the caret down.
    lastTap = null;
    const element = elementOf(item);
    if (!element) { editing = null; return; }
    makeEditable(element);
    if (atPoint) placeCaretAt(element, atPoint);
    else selectAll(element);
    core.requestRedraw();
  }

  function selectAll(element) {
    const range = document.createRange();
    range.selectNodeContents(element);
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
  }

  // Where the press landed, in the browser's own terms. caretRangeFromPoint is the
  // old spelling and caretPositionFromPoint the current one; between them every
