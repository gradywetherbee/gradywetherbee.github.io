  // Stored as the world point in the middle of the window rather than the corner
  // the format keeps, so a view pinned on a laptop opens on the same thing on a
  // monitor. The corner is worked back out on the way in.
  function cameraNow() {
    const view = board.scene().view;
    const canvas = board.core.canvas;
    return {
      x: round(view.x + canvas.clientWidth / 2 / view.scale, 2),
      y: round(view.y + canvas.clientHeight / 2 / view.scale, 2),
      scale: round(view.scale, 4)
    };
  }

  const inView = (item) => {
    const view = board.scene().view;
    const canvas = board.core.canvas;
    const box = board.core.boundsOf([item]);
    return box
      && box.x < view.x + canvas.clientWidth / view.scale && box.x + box.w > view.x
      && box.y < view.y + canvas.clientHeight / view.scale && box.y + box.h > view.y;
  };

  // What to call it. A view is named after the highest text in it, the way a
  // document is named after its own first line: the top of what you were looking
  // at is the heading of it. Selected text answers first if there is any, since
  // picking something out is a plainer way of saying which words those are.
  function viewName() {
    const text = board.scene().items.filter((item) =>
      item.type === 'text' && String(item.text || '').trim());
    const picked = text.filter((item) => board.selection().indexOf(item) >= 0);
    const pool = (picked.length ? picked : text.filter(inView)).map((item) =>
      ({ item: item, box: board.core.boundsOf([item]) })).filter((entry) => entry.box);
    pool.sort((a, b) => (a.box.y - b.box.y) || (a.box.x - b.box.x));
    const line = pool.length && String(pool[0].item.text).split('\n').find((part) => part.trim());
    return line ? line.trim().slice(0, 40) : 'View ' + (viewsOf(docById(currentId)).length + 1);
  }

  function pinView() {
    const doc = docById(currentId);
    if (!doc) return null;
    const pin = Object.assign({ id: freshId(), name: viewName() }, cameraNow());
    (doc.views || (doc.views = [])).push(pin);
    saveDocs();
    stale = true;               // the search knows about pinned views too
    justPinned = pin.id;
    paintPins();
    return pin;
  }

  function dropView(doc, view) {
    doc.views = viewsOf(doc).filter((entry) => entry.id !== view.id);
    saveDocs();
    stale = true;
    paintPins();
  }

  function startRenameView(doc, view, row) {
    editName(row, view.name, (name) => {
      view.name = name;
      saveDocs();
      stale = true;
      paintPins();
    }, paintPins, { back: pinFilter, placeholder: 'View name' });
  }

  // Takes you there and selects nothing. A pinned view is a place, and arriving
  // somewhere is not the same as picking up what you find.
  function goToView(view, docId) {
    if (docId && docId !== currentId) openDoc(docId);
    const camera = board.scene().view;
    camera.scale = view.scale || 1;
    camera.x = view.x - board.core.canvas.clientWidth / 2 / camera.scale;
    camera.y = view.y - board.core.canvas.clientHeight / 2 / camera.scale;
    if (board.core.selection) board.core.selection.clear();
    board.redraw();
    save();                     // the camera is part of the scene, and nothing else will
  }

  function paintRail() {
    const views = viewsOf(docById(currentId));
    pinRail.textContent = '';
    for (let at = 0; at < Math.max(1, Math.min(views.length, RAIL_MAX)); at++) {
      const dash = document.createElement('span');
      dash.className = views.length ? 'dash' : 'dash none';
      pinRail.appendChild(dash);
    }
    pinRail.setAttribute('aria-label', views.length
      ? views.length + (views.length === 1 ? ' pinned view' : ' pinned views')
      : 'Pinned views');
  }

  function paintPins() {
    paintRail();
    const doc = docById(currentId);
    const filter = pinFilter.value.trim().toLowerCase();
    pinList.textContent = '';
    for (const view of viewsOf(doc)) {
      if (filter && view.name.toLowerCase().indexOf(filter) < 0) continue;
      const row = document.createElement('div');
      row.className = 'doc-row';
      const pick = document.createElement('button');
      pick.className = view.id === justPinned ? 'pick fresh' : 'pick';
      pick.dataset.pick = '';
      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = view.name;
      pick.appendChild(label);
      pick.onclick = () => { showPins(false); goToView(view, currentId); };
      row.appendChild(pick);
      const sides = document.createElement('span');
      sides.className = 'sides';
      sides.appendChild(sideButton('edit', 'Rename', () => startRenameView(doc, view, row)));
      // No confirmation on the way out: a view is a bookmark, and pinning another
      // one is the same keystroke that made this one.
      sides.appendChild(sideButton('close', 'Delete', () => dropView(doc, view)));
      row.appendChild(sides);
      pinList.appendChild(row);
    }
    pinList.appendChild(addRow('+ Pin current view', 'P', () => { pinView(); linger(2000); }));
    pinNav.reset();
  }

  // --- search ---------------------------------------------------------------
  // Every document's name and every text item in every document, matched as you
  // type. The index is a trie over each word and each of that word's suffixes, so
  // "plan" and "ann" both reach "planning" without walking the corpus.
  //
  // The trie is a filter rather than an answer: it narrows to candidates and a
  // plain indexOf confirms each one. That is what lets it stop ten characters
  // deep and stay small, since a longer query is only ever narrowed further by
  // the characters the trie never stored.
  //
  // ponytail: suffixes are indexed only for the first WORD_REACH characters of a
  // word, which is the wrong trade for a language that does not put spaces
  // between words. A real corpus wants a suffix array or an inverted index with
  // positions; a page of notes does not. An embedding model would want megabytes
  // of weights over the network, which the no-dependencies rule settles.
  const DEPTH = 10;        // characters of a word the trie actually stores
  const WORD_REACH = 40;   // how far into a long word its suffixes are indexed
  const WORDS = /[^\p{L}\p{N}]+/u;
  const trie = { kids: null, post: null };
  let entries = [];
  let stale = true;

  const searchButton = document.getElementById('search-button');
  const searchPanel = document.getElementById('search-panel');
  const searchField = document.getElementById('search-field');
  const searchList = document.getElementById('search-list');

  function addWord(word, from, id) {
    let node = trie;
    for (let at = from; at < word.length && at - from < DEPTH; at++) {
      const kids = node.kids || (node.kids = Object.create(null));
      node = kids[word[at]] || (kids[word[at]] = { kids: null, post: null });
      const post = node.post || (node.post = []);
      // Entries go in one at a time, so a repeat of the same id is always the one
      // already on the end. No set, no sort, no duplicates.
      if (post[post.length - 1] !== id) post.push(id);
    }
  }

  function addEntry(entry) {
    entry.low = entry.text.toLowerCase();
    const id = entries.push(entry) - 1;
    for (const word of entry.low.split(WORDS)) {
      for (let at = 0; at < word.length && at < WORD_REACH; at++) addWord(word, at, id);
    }
  }

  function buildIndex() {
    entries = [];
    trie.kids = null;
    for (const doc of docs.list) {
      const scene = sceneOf(doc.id);
      const title = nameOf(doc, scene);
      addEntry({ docId: doc.id, title: title, text: title, kind: 'name' });
      ((scene && scene.items) || []).forEach((item, at) => {
        if (item.type !== 'text' || !item.text) return;
        addEntry({ docId: doc.id, title: title, text: String(item.text), kind: 'text', at: at });
      });
      // Somewhere you kept is as findable as something you wrote.
      for (const view of viewsOf(doc)) {
        addEntry({ docId: doc.id, title: title, text: view.name, kind: 'view', view: view });
      }
    }
    stale = false;
  }

  function lookup(token) {
    let node = trie;
    for (let at = 0; at < token.length && at < DEPTH; at++) {
      if (!node.kids) return null;
      node = node.kids[token[at]];
      if (!node) return null;
    }
    return node.post;
  }

  function search(query) {
    const tokens = query.toLowerCase().split(/\s+/).filter(Boolean);
    if (!tokens.length) return [];
    if (stale) buildIndex();
    // Every word has to be somewhere in the entry, so the candidate lists narrow
    // each other before anything is read.
    let pool = null;
    for (const token of tokens) {
      const found = lookup(token);
      if (!found) return [];
      if (!pool) { pool = found.slice(); continue; }
      const narrow = new Set(found);
      pool = pool.filter((id) => narrow.has(id));
      if (!pool.length) return [];
    }
    const hits = [];
    for (const id of pool) {
      const entry = entries[id];
      // A document is more than a line in one, and a place somebody kept on
      // purpose is more than a line they happened to write.
      let score = entry.kind === 'name' ? 40 : entry.kind === 'view' ? 20 : 0;
      let matched = true;
      for (const token of tokens) {
        const at = entry.low.indexOf(token);        // the trie narrows; this decides
        if (at < 0) { matched = false; break; }
        // A word you started typing beats one you landed in the middle of.
        score += (at === 0 || WORDS.test(entry.low[at - 1])) ? 10 : 2;
      }
      if (matched) hits.push({ entry: entry, score: score });
    }
    hits.sort((a, b) => b.score - a.score);
    return hits.slice(0, 50).map((hit) => hit.entry);
  }

  // A window around the first match, since a text item can be a paragraph and a
  // result row is a line.
  function snippet(text, tokens) {
    const flat = text.replace(/\s+/g, ' ').trim();
    const low = flat.toLowerCase();
    let at = -1;
    for (const token of tokens) {
      const found = low.indexOf(token);
      if (found >= 0 && (at < 0 || found < at)) at = found;
    }
    const from = at < 30 ? 0 : at - 25;
    const REACH = 140;   // as much of the line as the panel is wide enough to read
    return (from ? '…' : '') + flat.slice(from, from + REACH) + (flat.length > from + REACH ? '…' : '');
  }

  // Built out of nodes rather than a string of HTML: what is being marked up here
  // is somebody's notes, and notes are allowed to contain angle brackets.
  function paintMatch(node, text, tokens) {
    const low = text.toLowerCase();
    const hits = [];
    for (const token of tokens) {
      for (let at = low.indexOf(token); at >= 0; at = low.indexOf(token, at + token.length)) {
        hits.push([at, at + token.length]);
      }
    }
    hits.sort((a, b) => a[0] - b[0]);
    let cursor = 0;
    for (const [from, to] of hits) {
      if (from < cursor) continue;              // overlapping words: the first one wins
      node.appendChild(document.createTextNode(text.slice(cursor, from)));
      const mark = document.createElement('mark');
      mark.textContent = text.slice(from, to);
      node.appendChild(mark);
      cursor = to;
    }
    node.appendChild(document.createTextNode(text.slice(cursor)));
  }

  // Put the found item in the middle of the window and select it, so the answer to
  // "where is that" is the thing outlined in front of you.
  function focusItem(at) {
    const item = board.scene().items[at];
    if (!item) return;
    const box = board.core.boundsOf([item]);
    if (!box) return;
    const view = board.scene().view;
    view.scale = Math.max(0.5, Math.min(view.scale, 2));   // legible, without a jump either way
    view.x = box.x + box.w / 2 - board.core.canvas.clientWidth / 2 / view.scale;
    view.y = box.y + box.h / 2 - board.core.canvas.clientHeight / 2 / view.scale;
    if (board.core.selection) {
      board.core.selection.clear();
      board.core.selection.add(item);
    }
    board.redraw();
  }

  function go(entry) {
    showSearch(false);
    if (entry.docId !== currentId) openDoc(entry.docId);
    if (entry.kind === 'text') focusItem(entry.at);
    if (entry.kind === 'view') goToView(entry.view, entry.docId);
  }

  // An empty box is not an empty answer. Every pinned view in every document is
  // the list of places worth going, which is the question a search box open on
  // nothing is really asking.
  function allPinned() {
    if (stale) buildIndex();
    const when = (entry) => { const doc = docById(entry.docId); return (doc && doc.used) || 0; };
    return entries.filter((entry) => entry.kind === 'view').sort((a, b) => when(b) - when(a));
  }

  function paintResults() {
    const tokens = searchField.value.toLowerCase().split(/\s+/).filter(Boolean);
    searchList.textContent = '';
    const found = tokens.length ? search(searchField.value) : allPinned();
    if (!found.length) {
      if (tokens.length) {
        const nothing = document.createElement('div');
        nothing.className = 'empty';
        nothing.textContent = 'No matches';
        searchList.appendChild(nothing);
      }
      searchNav.reset();
      return;
    }
    for (const entry of found) {
      const pick = document.createElement('button');
      pick.className = 'pick';
      pick.dataset.pick = '';
      const label = document.createElement('span');
      label.className = 'label';
      paintMatch(label, snippet(entry.text, tokens), tokens);
      const where = document.createElement('span');
      where.className = 'where';
      where.textContent = entry.kind === 'name' ? 'document'
        : entry.kind === 'view' ? 'pinned view · ' + entry.title
        : entry.title;
      pick.appendChild(label);
      pick.appendChild(where);
      pick.onclick = () => go(entry);
      searchList.appendChild(pick);
    }
    searchNav.reset();
  }

  // --- opening and closing --------------------------------------------------
  function showDocs(showing) {
    docPanel.hidden = !showing;
    docButton.hidden = showing;      // the panel opens where the name was
    docButton.setAttribute('aria-expanded', String(showing));
    if (!showing) return;
    showSearch(false);
    showPins(false);
    docFilter.value = '';
    paintDocs();
    docFilter.focus();
  }

  function showSearch(showing) {
    searchPanel.hidden = !showing;
    if (!showing) return;
    showDocs(false);
    showPins(false);
    if (stale) buildIndex();
    paintResults();
    searchField.focus();
    searchField.select();
  }

  // The list hangs off the rail on hover, so it opens and closes without ever
  // being clicked. Focus goes to the field for the same reason it does in the
  // other two panels — arrows and Enter are how you get somewhere from a list —
  // and has to be handed back on the way out, or a panel nobody can see any more
  // would still be taking the keystrokes.
  let pinTimer = 0;
  let pinOver = false;
  function showPins(showing) {
    if (showing && pins.classList.contains('away')) return;   // hidden chrome opens nothing
    pinPanel.hidden = !showing;
    pins.classList.toggle('open', showing);
    pinRail.setAttribute('aria-expanded', String(showing));
    if (!showing) {
      justPinned = null;
      if (pinPanel.contains(document.activeElement)) document.activeElement.blur();
      return;
    }
    showDocs(false);
    showSearch(false);
    pinFilter.value = '';
    paintPins();
    pinFilter.focus();
  }

  // A pointer that has left goes on a short fuse rather than closing on the spot,
  // since the way from the rail to the list is a few pixels of nothing.
  function linger(ms) {
    clearTimeout(pinTimer);
    pinTimer = setTimeout(() => { if (!pinOver) showPins(false); }, ms);
  }

  // Both panels are a field, a list, arrows and Enter. One helper, so the two
  // cannot drift apart.
  function navigable(field, list, close) {
    let at = 0;
    const rows = () => [...list.querySelectorAll('[data-pick]')];
    const mark = (items) => items.forEach((row, index) =>
      row.setAttribute('aria-selected', String(index === at)));
    field.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') { event.stopPropagation(); close(); return; }
      const items = rows();
      if (!items.length) return;
      at = Math.min(at, items.length - 1);
      if (event.key === 'Enter') { items[at].click(); event.preventDefault(); return; }
      const step = event.key === 'ArrowDown' ? 1 : event.key === 'ArrowUp' ? -1 : 0;
      if (!step) return;
      at = (at + step + items.length) % items.length;
      mark(items);
      items[at].scrollIntoView({ block: 'nearest' });
      event.preventDefault();
    });
    return { reset: () => { at = 0; mark(rows()); } };
  }
  const docNav = navigable(docFilter, docList, () => showDocs(false));
  const searchNav = navigable(searchField, searchList, () => showSearch(false));
  const pinNav = navigable(pinFilter, pinList, () => showPins(false));

  docButton.onclick = () => showDocs(true);
  searchButton.onclick = () => showSearch(searchPanel.hidden);
  docFilter.oninput = paintDocs;
  searchField.oninput = paintResults;
  pinFilter.oninput = paintPins;

  // Hovering the rail opens the list. Not while a button is held, though: a stroke
  // drawn from the left edge of the window drags the pointer straight across it,
  // and a panel that opened mid-drag would be a panel nobody asked for.
  pinRail.addEventListener('pointerenter', (event) => {
    if (event.buttons || document.body.classList.contains('mc-dragging')) return;
    showPins(true);
  });
  // Tapping does what hovering does, for a finger, which has no hover to give. It
  // only ever opens: a tap raises pointerenter first, so a toggle here would close
  // the list its own touch had just opened. Tapping elsewhere puts it away.
  pinRail.onclick = () => showPins(true);
  for (const part of [pinRail, pinPanel]) {
    part.addEventListener('pointerenter', () => { pinOver = true; clearTimeout(pinTimer); });
    part.addEventListener('pointerleave', () => { pinOver = false; linger(180); });
  }
  // Typing in the list is a reason to keep it: the fuse lit by P is for a panel
  // nobody went to, not for one being filtered or a name being changed.
  pinPanel.addEventListener('keydown', () => clearTimeout(pinTimer));

  // ⌘space and ⌘K both open the search, hidden toolbar or not. Caught in the
  // capture phase because the canvas reads Space as a pan and would take the
  // cursor with it on the way past. Two keys rather than one because ⌘space is
  // Spotlight on macOS and often never reaches the page at all.
  window.addEventListener('keydown', (event) => {
    if (!(event.ctrlKey || event.metaKey)) return;
    const wanted = event.code === 'Space' || event.key === ' '
                || event.code === 'KeyK' || (event.key || '').toLowerCase() === 'k';
    if (!wanted) return;
    event.preventDefault();
    event.stopPropagation();
    showSearch(true);
  }, true);

  window.addEventListener('keydown', (event) => {
    if (event.key !== 'Escape') return;
    showDocs(false);
    showSearch(false);
    showPins(false);
  });

  // A press anywhere else puts them away, the same as the download menu.
  window.addEventListener('pointerdown', (event) => {
    const target = event.target;
    if (!target || !target.closest) return;
    if (!target.closest('#doc-panel, #doc-button')) showDocs(false);
    if (!target.closest('#search-panel, #search-button')) showSearch(false);
    if (!target.closest('#pins')) showPins(false);
  });

  // P pins where you are, N starts a document. Two plain letters, so they need the
  // guards every plain letter needs: not while a field has the keyboard, and not
  // while the canvas is taking text — the text tool preventDefaults whatever it
  // swallowed, which is how the page knows without asking it.
  window.addEventListener('keydown', (event) => {
    if (event.ctrlKey || event.metaKey || event.altKey || event.defaultPrevented) return;
    const tag = event.target && event.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (!board.core.isActive()) return;
    const key = (event.key || '').toLowerCase();
    if (key === 'p') {
      // Pinning is a keystroke with nothing on screen to show for it, so the list
      // opens long enough to read the name it chose and rename it. With the chrome
      // hidden it still pins; there is just nothing to show you.
      if (pinView()) { showPins(true); linger(2000); }
      event.preventDefault();
    } else if (key === 'n') {
      showDocs(true);
      startNewDoc();
      event.preventDefault();
    }
  });

  paintDocName();
  paintPins();

  // ⌘. gets the chrome out of the way. The bar and the pill that brings it back
  // are the same toggle, so there is only one piece of state to be wrong about.
  const toolbar = document.getElementById('toolbar');
  const peek = document.getElementById('peek');
  const showToolbar = (showing) => {
    toolbar.classList.toggle('away', !showing);
    peek.classList.toggle('here', !showing);
    // The document name and the search button are chrome too, and ⌘. means all of
    // it. The search panel itself is not: ⌘space still opens it from a bare page.
    docButton.classList.toggle('away', !showing);
    searchButton.classList.toggle('away', !showing);
    pins.classList.toggle('away', !showing);
    if (!showing) { showDocs(false); showSearch(false); showPins(false); }
  };
  const hideButton = document.getElementById('hide');
  hideButton.onclick = () => showToolbar(false);
  peek.onclick = () => showToolbar(true);
  window.addEventListener('keydown', (event) => {
    if (!(event.ctrlKey || event.metaKey)) return;
    if (event.key !== '.' && event.code !== 'Period') return;
    showToolbar(toolbar.classList.contains('away'));
    event.preventDefault();
  });

  // Which tool, which pen, and what the chrome looked like. Kept under its own key:
  // this is how the page was left, not what was drawn, and the two are worth being
  // able to clear apart from each other.
  const UI_KEY = 'minicanvas-demo-toolbar';

  function saveToolbar() {
    if (!store) return;
    const pen = board.pen();
    try {
      store.setItem(UI_KEY, JSON.stringify({
        tool: board.tool(),
        color: pen.color, width: pen.width, opacity: pen.opacity, fill: pen.fill,
        toolbar: !toolbar.classList.contains('away'),
        panel: !scenePanel.hidden
      }));
    } catch (error) { /* full, or refused */ }
  }

  function restoreToolbar() {
    let state = null;
    try { state = JSON.parse((store && store.getItem(UI_KEY)) || 'null'); }
    catch (error) { state = null; }   // whatever is in there, it is not ours
    if (!state) return;
    // Opacity and fill have no setter of their own, so they go on directly and
    // setStroke does the announcing for all four at once.
    if (typeof state.opacity === 'number') board.core.strokeOpacity = state.opacity;
    board.core.fillOn = !!state.fill;
    board.setStroke(state.color, state.width);
    if (state.tool) board.setTool(state.tool);
    showToolbar(state.toolbar !== false);
    showScenePanel(!!state.panel);
  }

  // The toolbar follows the canvas rather than tracking a tool of its own, so
  // whatever tool the board is actually on gets the pressed button — with or
  // without anything saved to restore. Without this a first visit, and every copy
  // of an exported page, shows a pressed tool that is not the one in hand.
  function syncTool() {
    press(toolButtons, toolButtons.find((button) => button.dataset.tool === board.tool()));
  }

  restoreToolbar();
  syncTool();
  board.on('toolchange', saveToolbar);
  board.on('penchange', saveToolbar);
  hideButton.onclick = () => { showToolbar(false); saveToolbar(); };
  peek.onclick = () => { showToolbar(true); saveToolbar(); };
  sceneButton.onclick = () => { showScenePanel(scenePanel.hidden); saveToolbar(); };
  window.addEventListener('keyup', saveToolbar);   // ⌘. and the letter shortcuts
})();
</script>
</html>
